<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>廃人検定 管理画面</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #20252b 0%,
          #111419 45%,
          #090b0e 100%
        );

      color: #f5f5f5;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .container {
      width:
        min(
          1500px,
          calc(100% - 32px)
        );

      margin: 0 auto;

      padding:
        32px 0
        80px;
    }

    .panel {
      border:
        1px solid
        #3c3725;

      border-radius:
        18px;

      background:
        linear-gradient(
          145deg,
          rgba(28, 32, 37, 0.97),
          rgba(13, 16, 20, 0.98)
        );

      box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.35);
    }

    .login-panel {
      width:
        min(
          520px,
          100%
        );

      margin:
        80px auto;

      padding:
        40px;
    }

    .kicker {
      color: #e8ba3d;

      font-size: 12px;
      font-weight: 800;

      letter-spacing: 0.18em;
    }

    h1 {
      margin:
        10px 0;

      font-size:
        34px;
    }

    .muted {
      color: #aab1ba;
    }

    label {
      display: grid;
      gap: 7px;

      color: #cbd0d6;

      font-size: 13px;
    }

    input,
    select,
    textarea {
      width: 100%;

      padding:
        12px 14px;

      border:
        1px solid
        #414852;

      border-radius:
        10px;

      color: #fff;

      background:
        #11151a;

      outline: none;
    }

    textarea {
      resize: vertical;

      min-height: 90px;

      line-height: 1.6;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #d4aa39;
    }

    .login-form {
      margin-top: 30px;

      display: grid;
      gap: 16px;
    }

    .gold-button {
      padding:
        13px 18px;

      border: 0;

      border-radius:
        10px;

      background:
        linear-gradient(
          135deg,
          #d49e22,
          #f2cf63
        );

      color: #17130a;

      font-weight: 900;
    }

    .secondary-button {
      padding:
        10px 15px;

      border:
        1px solid
        #444b54;

      border-radius:
        9px;

      color: #d7dbe0;

      background:
        #171b20;
    }

    .secondary-button:hover {
      border-color: #696f78;
    }

    .danger-button {
      padding:
        8px 10px;

      border:
        1px solid
        #8e403b;

      border-radius:
        7px;

      color:
        #ff8b84;

      background:
        rgba(
          190,
          55,
          48,
          0.09
        );

      font-size:
        11px;

      font-weight:
        800;
    }

    .danger-button:hover {
      background:
        rgba(
          190,
          55,
          48,
          0.18
        );
    }

    .login-error,
    .editor-error {
      min-height: 20px;

      color: #ff7770;

      font-size: 13px;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 20px;

      margin-bottom: 28px;
    }

    .admin-title h1 {
      margin:
        5px 0;
    }

    .header-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      margin-bottom: 25px;
    }

    .tab-button {
      padding:
        10px 17px;

      border:
        1px solid
        #3d434b;

      border-radius:
        999px;

      background:
        #15191e;

      color:
        #c5cbd1;

      font-weight:
        700;
    }

    .tab-button.active {
      border-color:
        #d6aa36;

      color:
        #f3ca55;

      background:
        rgba(
          207,
          161,
          43,
          0.1
        );
    }

    .stats-grid {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(190px, 1fr)
        );

      gap: 14px;
    }

    .stat-card {
      padding: 22px;

      min-height: 130px;
    }

    .stat-label {
      color: #9ea5ad;

      font-size: 13px;
      font-weight: 700;
    }

    .stat-value {
      margin-top: 10px;

      color: #f1c44c;

      font-size: 38px;
      font-weight: 900;

      line-height: 1;
    }

    .stat-sub {
      margin-top: 10px;

      color: #858d96;

      font-size: 12px;
    }

    .section {
      margin-top: 25px;
    }

    .section-panel {
      padding: 24px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      gap: 15px;

      margin-bottom: 18px;
    }

    .section-title {
      margin: 0;

      font-size: 20px;
    }

    .section-note {
      margin-top: 6px;

      color: #8f969e;

      font-size: 12px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;

      border-collapse: collapse;

      min-width: 1150px;
    }

    th,
    td {
      padding:
        11px 12px;

      text-align: left;

      border-bottom:
        1px solid
        #2d333a;

      vertical-align: top;

      font-size: 13px;
    }

    th {
      color: #d7b958;

      font-size: 12px;

      white-space: nowrap;
    }

    td {
      color: #d7dbe0;
    }

    tbody tr:hover {
      background:
        rgba(
          255,
          255,
          255,
          0.025
        );
    }

    .status {
      display: inline-block;

      padding:
        4px 8px;

      border-radius:
        999px;

      font-size: 11px;
      font-weight: 800;

      white-space: nowrap;
    }

    .status-complete {
      color: #85e0a2;

      background:
        rgba(
          65,
          180,
          104,
          0.13
        );
    }

    .status-abandoned {
      color: #f5a09b;

      background:
        rgba(
          211,
          72,
          65,
          0.14
        );
    }

    .status-active {
      color: #f1cc64;

      background:
        rgba(
          224,
          179,
          54,
          0.12
        );
    }

    .toolbar,
    .question-toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .toolbar input {
      width: 300px;
    }

    .toolbar select {
      width: auto;

      min-width: 150px;
    }

    .question-toolbar {
      margin:
        16px 0 10px;

      padding: 14px;

      border:
        1px solid
        #30363d;

      border-radius:
        12px;

      background:
        rgba(
          10,
          13,
          16,
          0.45
        );
    }

    .question-toolbar input {
      flex:
        2 1 250px;
    }

    .question-toolbar select {
      flex:
        1 1 145px;
    }

    .filter-summary {
      margin:
        13px 0;

      color:
        #8f969e;

      font-size:
        12px;
    }

    .filter-summary strong {
      color:
        #eac24d;
    }

    .category-badge,
    .meta-badge {
      display: inline-block;

      padding:
        3px 7px;

      border-radius:
        6px;

      white-space:
        nowrap;
    }

    .category-badge {
      background:
        #262c33;

      color:
        #e7c15a;
    }

    .meta-badge {
      background:
        #21262c;

      color:
        #bac1c8;

      font-size:
        11px;
    }

    .question-text {
      max-width: 600px;

      line-height: 1.6;
    }

    .accuracy {
      font-weight: 900;

      white-space:
        nowrap;
    }

    .accuracy-low {
      color: #ff7770;
    }

    .accuracy-mid {
      color: #e5b94b;
    }

    .accuracy-high {
      color: #74d890;
    }

    .accuracy-none {
      color: #737b84;
    }

    .accuracy-bar-wrap {
      width: 110px;
      height: 7px;

      margin-top: 6px;

      border-radius:
        999px;

      overflow: hidden;

      background:
        #2b3036;
    }

    .accuracy-bar {
      height: 100%;

      border-radius:
        999px;

      background:
        linear-gradient(
          90deg,
          #a87918,
          #efc64f
        );
    }

    .difficulty-measured {
      display: inline-flex;

      align-items: center;

      gap: 7px;

      white-space:
        nowrap;
    }

    .difficulty-number {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      width: 32px;
      height: 32px;

      border:
        1px solid
        #666;

      border-radius:
        50%;

      font-weight: 900;
    }

    .difficulty-1 {
      color: #73df96;
      border-color: #397f50;

      background:
        rgba(
          60,
          175,
          95,
          0.12
        );
    }

    .difficulty-2 {
      color: #5fd6c7;
      border-color: #347d75;

      background:
        rgba(
          60,
          180,
          165,
          0.12
        );
    }

    .difficulty-3 {
      color: #f0d05b;
      border-color: #8d772c;

      background:
        rgba(
          220,
          185,
          55,
          0.12
        );
    }

    .difficulty-4 {
      color: #f0a34d;
      border-color: #945e27;

      background:
        rgba(
          225,
          125,
          40,
          0.13
        );
    }

    .difficulty-5 {
      color: #ff6f69;
      border-color: #9d3d39;

      background:
        rgba(
          215,
          65,
          60,
          0.14
        );
    }

    .difficulty-provisional {
      color:
        #9da4ac;

      font-size:
        11px;
    }

    .difficulty-none {
      color:
        #707880;
    }

    .publication-badge {
      display: inline-block;

      padding:
        5px 9px;

      border-radius:
        999px;

      font-size:
        11px;
      font-weight:
        900;

      white-space:
        nowrap;
    }

    .published {
      color:
        #75df96;

      background:
        rgba(
          57,
          170,
          92,
          0.15
        );
    }

    .unpublished {
      color:
        #9ca4ad;

      background:
        #272c32;
    }

    .row-actions {
      display: flex;

      gap: 6px;

      flex-wrap:
        wrap;

      min-width:
        220px;
    }

    .edit-question-button,
    .toggle-publish-button {
      padding:
        7px 9px;

      border-radius:
        7px;

      font-size:
        11px;

      font-weight:
        800;
    }

    .edit-question-button {
      border:
        1px solid
        #656c74;

      color:
        #d8dde2;

      background:
        #1b2025;
    }

    .edit-question-button:hover {
      border-color:
        #949ca4;
    }

    /* 公開するボタン：緑 */

    .publish-action {
      border:
        1px solid
        #397f50;

      color:
        #73df96;

      background:
        rgba(
          60,
          175,
          95,
          0.12
        );
    }

    .publish-action:hover {
      border-color:
        #58b574;

      background:
        rgba(
          60,
          175,
          95,
          0.22
        );
    }

    /* 非公開にするボタン：オレンジ */

    .unpublish-action {
      border:
        1px solid
        #945e27;

      color:
        #f0a34d;

      background:
        rgba(
          225,
          125,
          40,
          0.13
        );
    }

    .unpublish-action:hover {
      border-color:
        #c77c34;

      background:
        rgba(
          225,
          125,
          40,
          0.23
        );
    }


    /* =========================
       物申す
    ========================= */

    .report-summary {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;

      margin-bottom: 18px;
    }

    .report-summary-item {
      padding:
        8px 12px;

      border:
        1px solid
        #343a42;

      border-radius:
        999px;

      background:
        #14181d;

      color:
        #b8bec5;

      font-size:
        12px;
    }

    .report-summary-item strong {
      margin-left: 5px;

      color:
        #f0c64d;
    }

    .report-card {
      padding: 18px;

      border:
        1px solid
        #333a42;

      border-radius:
        12px;

      background:
        #12161b;

      margin-bottom:
        14px;
    }

    .report-pending {
      border-left:
        4px solid
        #e9b93e;
    }

    .report-reviewing {
      border-left:
        4px solid
        #65aaf2;
    }

    .report-resolved {
      border-left:
        4px solid
        #67ce87;
    }

    .report-rejected {
      border-left:
        4px solid
        #e06d68;
    }

    .report-top {
      display: flex;
      justify-content: space-between;

      gap: 14px;

      margin-bottom:
        12px;
    }

    .report-meta {
      display: flex;
      gap: 10px;
      flex-wrap:
        wrap;

      color:
        #8e969f;

      font-size:
        12px;
    }

    .report-type {
      color:
        #efc44c;

      font-weight:
        800;
    }

    .report-status-badge {
      padding:
        5px 9px;

      border-radius:
        999px;

      font-size:
        11px;

      font-weight:
        900;

      white-space:
        nowrap;
    }

    .report-status-pending {
      color:
        #efc34f;

      background:
        rgba(
          222,
          170,
          35,
          0.14
        );
    }

    .report-status-reviewing {
      color:
        #70b8ff;

      background:
        rgba(
          62,
          139,
          215,
          0.14
        );
    }

    .report-status-resolved {
      color:
        #78dd96;

      background:
        rgba(
          62,
          173,
          96,
          0.14
        );
    }

    .report-status-rejected {
      color:
        #f1847f;

      background:
        rgba(
          210,
          73,
          67,
          0.14
        );
    }

    .report-question-row {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;

      margin-bottom:
        9px;
    }

    .report-question {
      color:
        #dfe3e7;

      font-weight:
        700;

      line-height:
        1.6;
    }

    .report-edit-question-button {
      flex:
        0 0 auto;

      padding:
        7px 10px;

      border:
        1px solid
        #5c646d;

      border-radius:
        7px;

      color:
        #d9dee3;

      background:
        #1b2025;

      font-size:
        11px;

      font-weight:
        800;
    }

    .report-edit-question-button:hover {
      border-color:
        #d1ab3f;

      color:
        #f2cb59;
    }

    .report-edit-question-button:disabled {
      opacity: 0.4;

      cursor: default;
    }

    .report-message {
      margin:
        0 0 17px;

      padding:
        12px 14px;

      border-radius:
        9px;

      background:
        #181d22;

      color:
        #d0d5db;

      white-space:
        pre-wrap;

      line-height:
        1.7;
    }

    .report-admin-area {
      display: grid;

      grid-template-columns:
        minmax(150px, 200px)
        1fr
        auto;

      gap: 12px;

      align-items:
        end;
    }

    .report-save-button {
      min-width:
        95px;

      padding:
        12px 16px;

      border:
        1px solid
        #947322;

      border-radius:
        9px;

      color:
        #f4cb57;

      background:
        rgba(
          211,
          162,
          34,
          0.09
        );

      font-weight:
        800;
    }

    .report-save-result,
    .report-handled {
      margin-top: 8px;

      font-size:
        11px;
    }

    .report-save-result {
      color:
        #77d994;
    }

    .report-handled {
      color:
        #7f8790;
    }


    /* =========================
       問題編集モーダル
    ========================= */

    .modal-overlay {
      position: fixed;

      inset: 0;

      z-index: 1000;

      padding:
        30px 15px;

      overflow-y:
        auto;

      background:
        rgba(
          0,
          0,
          0,
          0.78
        );
    }

    .editor-modal {
      width:
        min(
          900px,
          100%
        );

      margin:
        0 auto;

      padding: 26px;

      border:
        1px solid
        #66572d;

      border-radius:
        18px;

      background:
        #171c21;

      box-shadow:
        0 25px 80px
        rgba(
          0,
          0,
          0,
          0.55
        );
    }

    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      gap: 20px;

      margin-bottom: 22px;
    }

    .editor-header h2 {
      margin: 0;
    }

    .close-editor {
      border: 0;

      background:
        transparent;

      color: #aaa;

      font-size: 28px;

      line-height: 1;
    }

    .editor-grid {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 15px;
    }

    .editor-full {
      grid-column:
        1 / -1;
    }

    .choice-editor {
      display: grid;

      gap: 9px;

      margin-top: 8px;
    }

    .choice-row {
      display: grid;

      grid-template-columns:
        30px 30px 1fr;

      gap: 8px;

      align-items:
        center;
    }

    .choice-row input[type="radio"],
    .choice-row input[type="checkbox"] {
      width: auto;

      margin: 0;
    }

    .choice-index {
      color:
        #dfbb51;

      font-weight:
        800;

      text-align:
        center;
    }

    .answer-help {
      margin-top: 6px;

      color:
        #8e969f;

      font-size:
        11px;
    }

    .publish-check {
      display: flex;
      align-items: center;

      gap: 9px;

      padding: 13px;

      border:
        1px solid
        #3b4249;

      border-radius:
        10px;

      background:
        #12161b;
    }

    .publish-check input {
      width: auto;
    }

    .editor-footer {
      display: flex;
      justify-content:
        flex-end;

      gap: 10px;

      margin-top: 22px;
    }

    .loading,
    .empty {
      padding: 35px;

      text-align:
        center;

      color:
        #929aa3;
    }

    .error-box {
      padding: 15px;

      margin-bottom:
        20px;

      border:
        1px solid
        #753f3c;

      border-radius:
        10px;

      background:
        rgba(
          120,
          40,
          36,
          0.12
        );

      color:
        #ff9690;
    }

    @media (
      max-width: 800px
    ) {

      .admin-header,
      .section-head,
      .report-top,
      .report-question-row {
        flex-direction:
          column;

        align-items:
          flex-start;
      }

      .report-admin-area,
      .editor-grid {
        grid-template-columns:
          1fr;
      }

      .editor-full {
        grid-column:
          auto;
      }

      h1 {
        font-size: 27px;
      }
    }

  </style>
</head>


<body>

  <main class="container">


    <section
      id="login-screen"
      class="panel login-panel"
    >

      <div class="kicker">
        ASUKA KENZAN / ADMIN
      </div>

      <h1>
        廃人検定 管理画面
      </h1>

      <p class="muted">
        管理者アカウントでログインしてください。
      </p>


      <form
        id="login-form"
        class="login-form"
      >

        <label>

          メールアドレス

          <input
            id="admin-email"
            type="email"
            required
          >

        </label>


        <label>

          パスワード

          <input
            id="admin-password"
            type="password"
            required
          >

        </label>


        <button
          class="gold-button"
          type="submit"
        >
          管理画面へログイン
        </button>


        <div
          id="login-error"
          class="login-error"
        ></div>

      </form>

    </section>



    <section
      id="admin-screen"
      class="hidden"
    >

      <header class="admin-header">

        <div class="admin-title">

          <div class="kicker">
            ASUKA KENZAN / ADMIN DASHBOARD
          </div>

          <h1>
            廃人検定 管理画面
          </h1>

          <div
            id="admin-user-label"
            class="muted"
          ></div>

        </div>


        <div class="header-buttons">

          <button
            id="refresh-button"
            class="secondary-button"
          >
            最新データを再読み込み
          </button>

          <button

        return;

        !allowed
      ) {

        await adminClient
          .auth
          .signOut();


        showLogin();

        return;
      }


      showAdmin();


      await loadAllData();

    loginForm.addEventListener(
      "submit",
      async function (
        event
      ) {

        event.preventDefault();


        loginError.textContent =
          "";


        const button =
          loginForm.querySelector(
            "button[type='submit']"
          );


        button.disabled =
          true;


        button.textContent =
          "ログイン中...";


        try {

          const {
            error
          } =
            await adminClient
              .auth
              .signInWithPassword(
                {
                  email:
                    emailInput.value.trim(),

                  password:
                    passwordInput.value
                }
              );


          if (
            error
          ) {

            throw error;
          }


          const allowed =
            await checkAdmin();


          if (
            !allowed
          ) {

            await adminClient
              .auth
              .signOut();


            throw new Error(
              "このアカウントには管理者権限がありません。"
            );
          }


          passwordInput.value =
            "";


          showAdmin();


          await loadAllData();


        } catch (
          error

            error

          loginError.textContent =
            error.message ||
            "ログインできませんでした。";


        } finally {

          button.disabled =
            false;


          button.textContent =
            "管理画面へログイン";
        }
      }
    );



    async function checkAdmin() {

      const {
        data: {
          user
        },
        error:
          userError
      } =
        await adminClient
          .auth
          .getUser();


      if (
        userError ||
        !user
      ) {

        return false;
      }


      const {
        data,
        error
      } =
        await adminClient
          .from(
            "admin_users"
          )
          .select(
            "user_id"
          )
          .eq(
            "user_id",
            user.id
          )
          .maybeSingle();


      if (
        error
      ) {

        console.error(
          error
        );


        return false;
      }


      if (
        data
      ) {

        currentAdminUser =
          user;


        adminUserLabel.textContent =
          user.email ||
          "管理者";
      }


      return !!data;

              ),

              fetchAllRows(
                "question_reports",
                "*"
              ),

              fetchAllRows(
                "questions",
                "*"
              )

            ]
          );


        allQuestions =
          questions;


        allFirstAnswers =

        allReports =
          reports;


        refreshQuestionDerivedData();


        buildQuestionFilterOptions();


        renderStats(
          sessions,

        );


        renderSessions(
          sessions
        );


        applyQuestionStatsFilters();


        renderReportSummary();


        applyReportFilter();


        applyQuestionFilters();


      } catch (
        error
      ) {

        console.error(
          error
        );


        showGlobalError(
          error.message ||

        );

    async function fetchAnswerCount() {

      const {
        count,
        error
      } =
        await adminClient
          .from(
            "quiz_answers"
          )
          .select(
            "*",
            {
              count:
                "exact",

              head:
                true
            }
          );


      if (

      ) {

        throw error;
      }


      return count || 0;
    }



    async function fetchAllRows(
      table,
      columns
    ) {

      const rows =
        [];


      const pageSize =
        1000;


      let from =
        0;


      while (
        true
      ) {

        const {
          data,
          error
        } =
          await adminClient
            .from(
              table
            )
            .select(
              columns
            )
            .range(
              from,
              from +
              pageSize -
              1
            );


        if (
          error
        ) {

          throw error;
        }


        rows.push(
          ...data
        );


        if (
          data.length <
          pageSize
        ) {

          break;
        }


        from +=
          pageSize;
      }


      return rows;
    }

    function buildQuestionStats(
      questions,
      firstAnswers
    ) {

      const map =
        new Map();


      questions.forEach(
        function (
          question
        ) {

          map.set(
            String(
              question.id
            ),
            {
              id:
                question.id,

              category:
                question.category,

              question:
                question.question,

              attempts:
                0,

              correct:
                0,

              accuracy:
                null,

              measuredDifficulty:
                null
            }
          );
        }
      );


      firstAnswers.forEach(
        function (
          answer
        ) {

          const item =
            map.get(
              String(
                answer.question_id
              )
            );


          if (
            !item
          ) {

            return;
          }


          item.attempts++;


          if (
            answer.is_correct
          ) {

            item.correct++;
          }
        }
      );


      map.forEach(
        function (
          item
        ) {

          if (
            item.attempts >
            0
          ) {

            item.accuracy =
              item.correct /
              item.attempts *
              100;


            item.measuredDifficulty =
              calculateMeasuredDifficulty(
                item.accuracy
              );
          }
        }
      );


      return [
        ...map.values()
      ];
    }



    function calculateMeasuredDifficulty(
      accuracy
    ) {

      if (
        accuracy ===
        null ||
        accuracy ===
        undefined
      ) {

        return null;
      }


      if (
        accuracy <
        40
      ) {

        return 5;
      }


      if (
        accuracy <
        55
      ) {

        return 4;
      }


      if (
        accuracy <
        70
      ) {

        return 3;
      }


      if (
        accuracy <
        85
      ) {

        return 2;
      }


      return 1;
    }



    function renderMeasuredDifficulty(
      item
    ) {

      if (
        !item ||
        item.measuredDifficulty ===
        null
      ) {

        return `

          <span class="difficulty-none">
            未確定
          </span>

        `;
      }


      return `

        <span class="difficulty-measured">

          <span
            class="
              difficulty-number
              difficulty-${item.measuredDifficulty}
            "
          >
            ${item.measuredDifficulty}
          </span>

          ${
            item.attempts <
            20

              ? `

                <span class="difficulty-provisional">
                  暫定
                </span>

              `

              : ""
          }

        </span>

      `;
    }

    function applyQuestionStatsFilters() {

      const keyword =
        questionStatsSearch
          .value
          .trim()
          .toLowerCase();


      const category =
        questionStatsCategory.value;


      let rows =
        allQuestionStats.filter(
          function (
            item
          ) {

            if (
              category &&
              item.category !==
              category
            ) {

              return false;
            }


            if (
              keyword
            ) {

              const text =
                [
                  item.id,
                  item.question
                ]
                  .join(
                    " "
                  )
                  .toLowerCase();


              if (
                !text.includes(
                  keyword
                )
              ) {

                return false;
              }
            }


            return true;
          }
        );


      const sort =
        questionStatsSort.value;


      if (
        sort ===
        "accuracy-asc"
      ) {

        rows.sort(
          function (
            a,
            b
          ) {

            return compareNullable(
              a.accuracy,
              b.accuracy,
              "asc"
            );
          }
        );


      } else if (
        sort ===
        "accuracy-desc"
      ) {

        rows.sort(
          function (
            a,
            b
          ) {

            return compareNullable(
              a.accuracy,
              b.accuracy,
              "desc"
            );
          }
        );


      } else if (
        sort ===
        "attempts-desc"
      ) {

        rows.sort(
          function (
            a,
            b
          ) {

            return (
              b.attempts -
              a.attempts
            );
          }
        );


      } else if (
        sort ===
        "measured-desc"
      ) {

        rows.sort(
          function (
            a,
            b
          ) {

            return (
              (
                b.measuredDifficulty ??
                -1
              ) -
              (
                a.measuredDifficulty ??
                -1
              )
            );
          }
        );


      } else {

        rows.sort(
          function (
            a,
            b
          ) {

            return (
              Number(
                a.id
              ) -
              Number(
                b.id
              )
            );
          }
        );
      }


      renderQuestionStats(
        rows
      );
    }

          );


        saveButton.disabled =
          true;


        saveButton.textContent =
          "保存中...";


        try {

          const finished =
            status ===
              "resolved" ||
            status ===
              "rejected";


          const {
            data,
            error
          } =
            await adminClient
              .from(
                "question_reports"
              )
              .update(
                {
                  status:
                    status,

                  admin_note:
                    note ||
                    null,

                  handled_by:
                    currentAdminUser.id,

                  handled_at:
                    finished

                      ? new Date()
                          .toISOString()

                      : null
                }
              )
              .eq(
                "id",
                report.id
              )
              .select()
              .single();


          if (
            error
          ) {

            throw error;
          }


          const index =
            allReports.findIndex(
              function (
                item
              ) {

                return (
                  String(
                    item.id
                  ) ===
                  String(
                    report.id
                  )
                );
              }
            );


          allReports[
            index
          ] =
            data;


          resultBox.textContent =
            "保存しました";


          renderReportSummary();


          setTimeout(
            applyReportFilter,
            400
          );


        } catch (
          error
        ) {

          resultBox.textContent =
            error.message;


        } finally {

          saveButton.disabled =
            false;


          saveButton.textContent =
            "保存";
        }
      }
    );

    function buildQuestionFilterOptions() {

      const oldVerification =
        questionVerificationFilter.value;


      const oldStage =
        questionStageFilter.value;


      const verificationValues =
        uniqueNonEmpty(
          allQuestions.map(
            function (
              item
            ) {

              return item.verification;
            }
          )
        );


      const stageValues =
        uniqueNonEmpty(
          allQuestions.map(
            function (
              item
            ) {

              return item.production_stage;
            }
          )
        );


      questionVerificationFilter.innerHTML = `

        <option value="">
          全検証状態
        </option>

        <option value="__empty__">
          未設定
        </option>

        ${
          verificationValues
            .map(
              function (
                value
              ) {

                return `

                  <option
                    value="${escapeHtml(
                      value
                    )}"
                  >
                    ${escapeHtml(
                      value
                    )}
                  </option>

                `;
              }
            )
            .join("")
        }

      `;


      questionStageFilter.innerHTML = `

        <option value="">
          全制作段階
        </option>

        <option value="__empty__">
          未設定
        </option>

        ${
          stageValues
            .map(
              function (
                value
              ) {

                return `

                  <option
                    value="${escapeHtml(
                      value
                    )}"
                  >
                    ${escapeHtml(
                      value
                    )}
                  </option>

                `;
              }
            )
            .join("")
        }

      `;


      if (
        [
          ...questionVerificationFilter.options
        ].some(
          function (
            option
          ) {

            return (
              option.value ===
              oldVerification
            );
          }
        )
      ) {

        questionVerificationFilter.value =
          oldVerification;
      }


      if (
        [
          ...questionStageFilter.options
        ].some(
          function (
            option
          ) {

            return (
              option.value ===
              oldStage
            );
          }
        )
      ) {

        questionStageFilter.value =
          oldStage;
      }
    }



    function applyQuestionFilters() {

      const keyword =
        questionSearch
          .value
          .trim()
          .toLowerCase();


      const publication =
        questionPublicationFilter.value;


      const category =
        questionCategoryFilter.value;


      const difficulty =
        questionDifficultyFilter.value;


      const verification =
        questionVerificationFilter.value;


      const stage =
        questionStageFilter.value;


      let rows =
        allQuestions.filter(
          function (
            question
          ) {

            const stats =
              questionStatsMap.get(
                String(
                  question.id
                )
              );


            if (
              publication ===
              "published" &&
              !question.is_published
            ) {

              return false;
            }


            if (
              publication ===
              "unpublished" &&
              question.is_published
            ) {

              return false;
            }


            if (
              category &&
              question.category !==
              category
            ) {

              return false;
            }


            if (
              difficulty ===
              "unrated"
            ) {

              if (
                stats &&
                stats.measuredDifficulty !==
                null
              ) {

                return false;
              }


            } else if (
              difficulty
            ) {

              if (
                !stats ||
                String(
                  stats.measuredDifficulty
                ) !==
                difficulty
              ) {

                return false;
              }
            }


            if (
              !matchesOptionalFilter(
                question.verification,
                verification
              )
            ) {

              return false;
            }


            if (
              !matchesOptionalFilter(
                question.production_stage,
                stage
              )
            ) {

              return false;
            }


            if (
              keyword
            ) {

              const text =
                [
                  question.id,
                  question.category,
                  question.question,
                  question.explanation,
                  question.verification,
                  question.production_stage
                ]
                  .join(
                    " "
                  )
                  .toLowerCase();


              if (
                !text.includes(
                  keyword
                )
              ) {

                return false;
              }
            }


            return true;
          }
        );


      rows =
        sortQuestions(
          rows
        );


      renderQuestions(
        rows
      );
    }



    function sortQuestions(
      rows
    ) {

      const sort =
        questionSort.value;


      return [
        ...rows
      ].sort(
        function (
          a,
          b
        ) {

          const sa =
            questionStatsMap.get(
              String(
                a.id
              )
            );


          const sb =
            questionStatsMap.get(
              String(
                b.id
              )
            );


          if (
            sort ===
            "id-desc"
          ) {

            return (
              Number(
                b.id
              ) -
              Number(
                a.id
              )
            );
          }


          if (
            sort ===
            "difficulty-desc"
          ) {

            return (
              (
                sb?.measuredDifficulty ??
                -1
              ) -
              (
                sa?.measuredDifficulty ??
                -1
              )
            );
          }


          if (
            sort ===
            "accuracy-asc"
          ) {

            return compareNullable(
              sa?.accuracy ??
              null,

              sb?.accuracy ??
              null,

              "asc"
            );
          }


          if (
            sort ===
            "accuracy-desc"
          ) {

            return compareNullable(
              sa?.accuracy ??
              null,

              sb?.accuracy ??
              null,

              "desc"
            );
          }


          if (
            sort ===
            "attempts-desc"
          ) {

            return (
              (
                sb?.attempts ??
                0
              ) -
              (
                sa?.attempts ??
                0
              )
            );
          }


          return (
            Number(
              a.id
            ) -
            Number(
              b.id
            )
          );
        }
      );
    }

          );

        ) {

              );

          );

    async function toggleQuestionPublication(
      question,
      button
    ) {

      const newValue =
        !question.is_published;


      button.disabled =
        true;


      button.textContent =
        "更新中...";


      try {

        const {
          data,
          error
        } =
          await adminClient
            .from(
              "questions"
            )
            .update(
              {
                is_published:
                  newValue
              }
            )
            .eq(
              "id",
              question.id
            )
            .select()
            .single();


        if (
          error
        ) {

          throw error;
        }


        replaceQuestion(
          data
        );


      } catch (
        error
      ) {

        alert(
          "公開状態を変更できませんでした。\n\n" +
          error.message
        );


      } finally {

        button.disabled =
          false;
      }
    }



    async function deleteQuestion(
      question,
      button
    ) {

      const stats =
        questionStatsMap.get(
          String(
            question.id
          )
        );


      const attempts =
        stats
          ? stats.attempts
          : 0;


      const publication =
        question.is_published
          ? "現在、この問題は【公開中】です。"
          : "現在、この問題は非公開です。";


      const warning =

        `問題 #${question.id} を完全に削除します。\n\n` +

        `${publication}\n` +

        `初回回答データ：${attempts}人\n\n` +

        `問題文：\n${question.question}\n\n` +

        `questionsテーブルから削除されます。\n` +

        `この操作は元に戻せません。\n\n` +

        `本当に削除しますか？`;


      const confirmed =
        window.confirm(
          warning
        );


      if (
        !confirmed
      ) {

        return;
      }


      if (
        attempts >
        0
      ) {

        const secondConfirm =
          window.confirm(

            `最終確認です。\n\n` +

            `問題 #${question.id} には ` +
            `${attempts}人の初回回答データがあります。\n\n` +

            `問題そのものを削除しても、` +
            `過去の回答記録は別テーブルに残ります。\n\n` +

            `それでも削除しますか？`

          );


        if (
          !secondConfirm
        ) {

          return;
        }
      }


      button.disabled =
        true;


      button.textContent =
        "削除中...";


      try {

        const {
          error
        } =
          await adminClient
            .from(
              "questions"
            )
            .delete()
            .eq(
              "id",
              question.id
            );


        if (
          error
        ) {

          throw error;
        }


        allQuestions =
          allQuestions.filter(
            function (
              item
            ) {

              return (
                String(
                  item.id
                ) !==
                String(
                  question.id
                )
              );
            }
          );


        refreshQuestionDerivedData();


        buildQuestionFilterOptions();


        applyQuestionStatsFilters();


        applyQuestionFilters();


        applyReportFilter();


        alert(
          `問題 #${question.id} を削除しました。`
        );


      } catch (
        error
      ) {

        console.error(
          error
        );


        alert(
          "問題を削除できませんでした。\n\n" +
          error.message
        );


      } finally {

        button.disabled =
          false;


        button.textContent =
          "削除";
      }
    }

    function openQuestionEditor(
      question
    ) {

      resetQuestionEditor();


      if (
        question
      ) {

        editingQuestionId =
          question.id;


        editorTitle.textContent =
          "問題を編集";


        editorIdLabel.textContent =
          `問題ID #${question.id}`;


        editorCategory.value =
          question.category;


        editorType.value =
          question.type;


        editorQuestion.value =
          question.question ||
          "";


        editorInstruction.value =
          question.instruction ||
          "";


        editorExplanation.value =
          question.explanation ||
          "";


        editorVerification.value =
          question.verification ||
          "";


        editorProductionStage.value =
          question.production_stage ||
          "";


        editorTags.value =
          Array.isArray(
            question.tags
          )

            ? question.tags.join(
                ", "
              )

            : "";


        editorSource.value =
          question.source ||
          "";


        editorPublished.checked =
          !!question.is_published;


        const choices =
          Array.isArray(
            question.choices
          )

            ? question.choices

            : [];


        choices.forEach(
          function (
            choice,
            index
          ) {

            if (
              choiceInputs[
                index
              ]
            ) {

              choiceInputs[
                index
              ].value =
                choice;
            }
          }
        );


        if (
          question.type ===
          "multiple"
        ) {

          const answers =
            Array.isArray(
              question.answer
            )

              ? question.answer

              : [];


          answers.forEach(
            function (
              index
            ) {

              if (
                multiAnswers[
                  index
                ]
              ) {

                multiAnswers[
                  index
                ].checked =
                  true;
              }
            }
          );


        } else {

          const answer =
            Number(
              question.answer
            );


          if (
            singleAnswers[
              answer
            ]
          ) {

            singleAnswers[
              answer
            ].checked =
              true;
          }
        }


      } else {

        editingQuestionId =
          null;


        editorTitle.textContent =
          "新しい問題を作成";


        editorIdLabel.textContent =
          "保存時にIDを自動採番します";


        editorCategory.value =
          "仕様";


        editorType.value =
          "single";


        editorProductionStage.value =
          "仮作成";


        editorPublished.checked =
          false;
      }


      updateAnswerControlMode();


      editorOverlay
        .classList
        .remove(
          "hidden"
        );


      document.body.style.overflow =
        "hidden";
    }



    function resetQuestionEditor() {

      editorForm.reset();


      editorError.textContent =
        "";


      editingQuestionId =
        null;


      choiceInputs.forEach(
        function (
          input
        ) {

          input.value =
            "";
        }
      );


      singleAnswers.forEach(
        function (
          input
        ) {

          input.checked =
            false;
        }
      );


      multiAnswers.forEach(
        function (
          input
        ) {

          input.checked =
            false;
        }
      );
    }



    function closeQuestionEditor() {

      editorOverlay
        .classList
        .add(
          "hidden"
        );


      document.body.style.overflow =
        "";


      editingQuestionId =
        null;
    }



    function updateAnswerControlMode() {

      const multiple =
        editorType.value ===
        "multiple";


      singleAnswers.forEach(
        function (
          input
        ) {

          input
            .classList
            .toggle(
              "hidden",
              multiple
            );
        }
      );


      multiAnswers.forEach(
        function (
          input
        ) {

          input
            .classList
            .toggle(
              "hidden",
              !multiple
            );
        }
      );
    }



    editorForm.addEventListener(
      "submit",
      async function (
        event
      ) {

        event.preventDefault();


        editorError.textContent =
          "";


        saveQuestionButton.disabled =
          true;


        saveQuestionButton.textContent =
          "保存中...";


        try {

          const payload =
            buildQuestionPayload();


          let response;


          if (
            editingQuestionId ===
            null
          ) {

            response =
              await adminClient
                .from(
                  "questions"
                )
                .insert(
                  payload
                )
                .select()
                .single();


          } else {

            response =
              await adminClient
                .from(
                  "questions"
                )
                .update(
                  payload
                )
                .eq(
                  "id",
                  editingQuestionId
                )
                .select()
                .single();
          }


          if (
            response.error
          ) {

            throw response.error;
          }


          if (
            editingQuestionId ===
            null
          ) {

            allQuestions.push(
              response.data
            );


          } else {

            replaceQuestion(
              response.data,
              false
            );
          }


          refreshQuestionDerivedData();


          buildQuestionFilterOptions();


          applyQuestionStatsFilters();


          applyQuestionFilters();


          applyReportFilter();


          const savedId =
            response.data.id;


          closeQuestionEditor();


          alert(
            `問題 #${savedId} を保存しました。`
          );


        } catch (
          error
        ) {

          console.error(
            error
          );


          editorError.textContent =
            error.message ||
            "保存できませんでした。";


        } finally {

          saveQuestionButton.disabled =
            false;


          saveQuestionButton.textContent =
            "保存";
        }
      }
    );



    function buildQuestionPayload() {

      const question =
        editorQuestion
          .value
          .trim();


      if (
        !question
      ) {

        throw new Error(
          "問題文を入力してください。"
        );
      }


      const rawChoices =
        choiceInputs.map(
          function (
            input
          ) {

            return input.value.trim();
          }
        );


      if (
        !rawChoices[0] ||
        !rawChoices[1]
      ) {

        throw new Error(
          "選択肢1と選択肢2は必須です。"
        );
      }


      let blankFound =
        false;


      for (
        const choice of rawChoices
      ) {

        if (
          !choice
        ) {

          blankFound =
            true;


        } else if (
          blankFound
        ) {

          throw new Error(
            "選択肢は途中を空欄にせず、上から順に入力してください。"
          );
        }
      }


      const choices =
        rawChoices.filter(
          Boolean
        );


      let answer;


      if (
        editorType.value ===
        "multiple"
      ) {

        answer =
          multiAnswers
            .filter(
              function (
                input
              ) {

                return (
                  input.checked &&
                  Number(
                    input.value
                  ) <
                  choices.length
                );
              }
            )
            .map(
              function (
                input
              ) {

                return Number(
                  input.value
                );
              }
            );


        if (
          !answer.length
        ) {

          throw new Error(
            "正解を1つ以上選択してください。"
          );
        }


      } else {

        const selected =
          singleAnswers.find(
            function (
              input
            ) {

              return input.checked;
            }
          );


        if (
          !selected
        ) {

          throw new Error(
            "正解を選択してください。"
          );
        }


        answer =
          Number(
            selected.value
          );


        if (
          answer >=
          choices.length
        ) {

          throw new Error(
            "空欄の選択肢を正解にはできません。"
          );
        }
      }


      const tags =
        editorTags
          .value
          .split(
            ","
          )
          .map(
            function (
              value
            ) {

              return value.trim();
            }
          )
          .filter(
            Boolean
          );


      return {

        category:
          editorCategory.value,

        type:
          editorType.value,

        instruction:
          emptyToNull(
            editorInstruction.value
          ),

        question:
          question,

        choices:
          choices,

        answer:
          answer,

        explanation:
          emptyToNull(
            editorExplanation.value
          ),

        tags:
          tags,

        source:
          emptyToNull(
            editorSource.value
          ),

        verification:
          emptyToNull(
            editorVerification.value
          ),

        production_stage:
          emptyToNull(
            editorProductionStage.value
          ),

        is_published:
          editorPublished.checked
      };
    }



    function replaceQuestion(
      question,
      render =
        true
    ) {

      const index =
        allQuestions.findIndex(
          function (
            item
          ) {

            return (
              String(
                item.id
              ) ===
              String(
                question.id
              )
            );
          }
        );


      if (
        index !==
        -1
      ) {

        allQuestions[
          index
        ] =
          question;
      }


      if (
        render
      ) {

        refreshQuestionDerivedData();


        buildQuestionFilterOptions();


        applyQuestionStatsFilters();


        applyQuestionFilters();


        applyReportFilter();
      }
    }



    function uniqueNonEmpty(
      values
    ) {

      return [
        ...new Set(
          values
            .map(
              function (
                value
              ) {

                return String(
                  value ||
                  ""
                ).trim();
              }
            )
            .filter(
              Boolean
            )
        )
      ].sort();
    }



    function matchesOptionalFilter(
      actual,
      wanted
    ) {

      if (
        !wanted
      ) {

        return true;
      }


      const value =
        String(
          actual ||
          ""
        ).trim();


      if (
        wanted ===
        "__empty__"
      ) {

        return !value;
      }


      return (
        value ===
        wanted
      );
    }



    function compareNullable(
      a,
      b,
      direction
    ) {

      if (
        a ===
        null &&
        b ===
        null
      ) {

        return 0;
      }


      if (
        a ===
        null
      ) {

        return 1;
      }


      if (
        b ===
        null
      ) {

        return -1;
      }


      return (
        direction ===
        "desc"

          ? b - a

          : a - b
      );
    }



    function formatAccuracy(
      value
    ) {

      const rounded =
        Math.round(
          value *
          10
        ) /
        10;


      return Number.isInteger(
        rounded
      )

        ? String(
            rounded
          )

        : rounded.toFixed(
            1
          );
    }



    function getAccuracyClass(
      value
    ) {

      if (
        value ===
        null ||
        value ===
        undefined
      ) {

        return "accuracy-none";
      }


      if (
        value <
        40
      ) {

        return "accuracy-low";
      }


      if (
        value <
        70
      ) {

        return "accuracy-mid";
      }


      return "accuracy-high";
    }



    function formatJst(
      value
    ) {

      if (
        !value
      ) {

        return "-";
      }


      const date =
        new Date(
          value
        );


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return "-";
      }


      return new Intl.DateTimeFormat(
        "ja-JP",
        {
          timeZone:
            "Asia/Tokyo",

          year:
            "numeric",

          month:
            "2-digit",

          day:
            "2-digit",

          hour:
            "2-digit",

          minute:
            "2-digit",

          second:
            "2-digit",

          hour12:
            false
        }
      ).format(
        date
      );
    }



    function emptyToNull(
      value
    ) {

      const text =
        String(
          value ||
          ""
        ).trim();


      return (
        text ||
        null
      );
    }



    function shortId(
      value
    ) {

      if (
        !value
      ) {

        return "-";
      }


      const text =
        String(
          value
        );


      return (
        text.length >
        12

          ? text.slice(
              0,
              8
            ) +
            "…"

          : text
      );
    }



    function escapeHtml(
      value
    ) {

      return String(
        value ??
        ""
      )

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );
    }



    function showGlobalError(
      message
    ) {

      globalError.textContent =
        message;


      globalError
        .classList
        .remove(
          "hidden"
        );
    }



    function hideGlobalError() {

      globalError.textContent =
        "";


      globalError
        .classList
        .add(
          "hidden"
        );
    }

  </script>
