<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>廃人検定 管理画面</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #20252b 0%,
          #111419 45%,
          #090b0e 100%
        );

      color: #f5f5f5;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .container {
      width:
        min(
          1500px,
          calc(100% - 32px)
        );

      margin: 0 auto;

      padding:
        32px 0
        80px;
    }

    .panel {
      border:
        1px solid
        #3c3725;

      border-radius:
        18px;

      background:
        linear-gradient(
          145deg,
          rgba(28, 32, 37, 0.97),
          rgba(13, 16, 20, 0.98)
        );

      box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.35);
    }


    /* =========================
       ログイン
    ========================= */

    .login-panel {
      width:
        min(
          520px,
          100%
        );

      margin:
        80px auto;

      padding:
        40px;
    }

    .kicker {
      color:
        #e8ba3d;

      font-size:
        12px;

      font-weight:
        800;

      letter-spacing:
        0.18em;
    }

    h1 {
      margin:
        10px 0;

      font-size:
        34px;
    }

    .muted {
      color:
        #aab1ba;
    }

    .login-form {
      margin-top:
        30px;

      display:
        grid;

      gap:
        16px;
    }

    label {
      display:
        grid;

      gap:
        7px;

      color:
        #cbd0d6;

      font-size:
        13px;
    }

    input,
    select {
      width:
        100%;

      padding:
        12px 14px;

      border:
        1px solid
        #414852;

      border-radius:
        10px;

      color:
        #fff;

      background:
        #11151a;

      outline:
        none;
    }

    input:focus,
    select:focus {
      border-color:
        #d4aa39;
    }

    .gold-button {
      padding:
        14px 18px;

      border:
        0;

      border-radius:
        10px;

      background:
        linear-gradient(
          135deg,
          #d49e22,
          #f2cf63
        );

      color:
        #17130a;

      font-weight:
        800;
    }

    .secondary-button {
      padding:
        10px 15px;

      border:
        1px solid
        #444b54;

      border-radius:
        9px;

      color:
        #d7dbe0;

      background:
        #171b20;
    }

    .login-error {
      min-height:
        22px;

      color:
        #ff7770;

      font-size:
        14px;
    }


    /* =========================
       ヘッダー
    ========================= */

    .admin-header {
      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      gap:
        20px;

      margin-bottom:
        28px;
    }

    .admin-title h1 {
      margin:
        5px 0;
    }

    .header-buttons {
      display:
        flex;

      gap:
        10px;

      flex-wrap:
        wrap;
    }


    /* =========================
       タブ
    ========================= */

    .nav-tabs {
      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        8px;

      margin-bottom:
        25px;
    }

    .tab-button {
      padding:
        10px 17px;

      border:
        1px solid
        #3d434b;

      border-radius:
        999px;

      background:
        #15191e;

      color:
        #c5cbd1;

      font-weight:
        700;
    }

    .tab-button.active {
      border-color:
        #d6aa36;

      color:
        #f3ca55;

      background:
        rgba(
          207,
          161,
          43,
          0.1
        );
    }


    /* =========================
       集計カード
    ========================= */

    .stats-grid {
      display:
        grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(190px, 1fr)
        );

      gap:
        14px;
    }

    .stat-card {
      padding:
        22px;

      min-height:
        130px;
    }

    .stat-label {
      color:
        #9ea5ad;

      font-size:
        13px;

      font-weight:
        700;
    }

    .stat-value {
      margin-top:
        10px;

      color:
        #f1c44c;

      font-size:
        38px;

      font-weight:
        900;

      line-height:
        1;
    }

    .stat-sub {
      margin-top:
        10px;

      color:
        #858d96;

      font-size:
        12px;
    }


    /* =========================
       セクション
    ========================= */

    .section {
      margin-top:
        25px;
    }

    .section-panel {
      padding:
        24px;
    }

    .section-head {
      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      gap:
        15px;

      margin-bottom:
        18px;
    }

    .section-title {
      margin:
        0;

      font-size:
        20px;
    }

    .section-note {
      margin-top:
        6px;

      color:
        #8f969e;

      font-size:
        12px;
    }


    /* =========================
       テーブル
    ========================= */

    .table-wrap {
      overflow-x:
        auto;
    }

    table {
      width:
        100%;

      border-collapse:
        collapse;

      min-width:
        900px;
    }

    th,
    td {
      padding:
        11px 12px;

      text-align:
        left;

      border-bottom:
        1px solid
        #2d333a;

      vertical-align:
        top;

      font-size:
        13px;
    }

    th {
      color:
        #d7b958;

      font-size:
        12px;

      white-space:
        nowrap;
    }

    td {
      color:
        #d7dbe0;
    }

    tbody tr:hover {
      background:
        rgba(
          255,
          255,
          255,
          0.025
        );
    }


    /* =========================
       ステータス
    ========================= */

    .status {
      display:
        inline-block;

      padding:
        4px 8px;

      border-radius:
        999px;

      font-size:
        11px;

      font-weight:
        800;

      white-space:
        nowrap;
    }

    .status-complete {
      color:
        #85e0a2;

      background:
        rgba(
          65,
          180,
          104,
          0.13
        );
    }

    .status-abandoned {
      color:
        #f5a09b;

      background:
        rgba(
          211,
          72,
          65,
          0.14
        );
    }

    .status-active {
      color:
        #f1cc64;

      background:
        rgba(
          224,
          179,
          54,
          0.12
        );
    }


    /* =========================
       ツールバー
    ========================= */

    .toolbar {
      display:
        flex;

      gap:
        10px;

      flex-wrap:
        wrap;

      align-items:
        center;
    }

    .toolbar input {
      width:
        320px;
    }

    .toolbar select {
      width:
        auto;

      min-width:
        150px;
    }


    /* =========================
       問題別統計
    ========================= */

    .accuracy {
      font-weight:
        900;

      white-space:
        nowrap;
    }

    .accuracy-low {
      color:
        #ff7770;
    }

    .accuracy-mid {
      color:
        #e5b94b;
    }

    .accuracy-high {
      color:
        #74d890;
    }

    .accuracy-none {
      color:
        #737b84;
    }

    .accuracy-bar-wrap {
      width:
        120px;

      height:
        7px;

      margin-top:
        6px;

      border-radius:
        999px;

      overflow:
        hidden;

      background:
        #2b3036;
    }

    .accuracy-bar {
      height:
        100%;

      border-radius:
        999px;

      background:
        linear-gradient(
          90deg,
          #a87918,
          #efc64f
        );
    }

    .difficulty {
      font-weight:
        800;

      color:
        #e4c45f;
    }

    .question-text {
      max-width:
        620px;

      line-height:
        1.6;
    }


    /* =========================
       物申す
    ========================= */

    .report-card {
      padding:
        18px;

      border:
        1px solid
        #333a42;

      border-radius:
        12px;

      background:
        #12161b;

      margin-bottom:
        12px;
    }

    .report-meta {
      display:
        flex;

      gap:
        10px;

      flex-wrap:
        wrap;

      color:
        #8e969f;

      font-size:
        12px;

      margin-bottom:
        9px;
    }

    .report-type {
      color:
        #efc44c;

      font-weight:
        800;
    }

    .report-question {
      margin-bottom:
        8px;

      color:
        #dfe3e7;

      font-weight:
        700;
    }

    .report-message {
      margin:
        0;

      color:
        #c8ced5;

      white-space:
        pre-wrap;

      line-height:
        1.7;
    }


    /* =========================
       問題一覧
    ========================= */

    .question-count {
      color:
        #eac24d;

      font-weight:
        800;
    }

    .category-badge {
      display:
        inline-block;

      padding:
        3px 7px;

      border-radius:
        6px;

      background:
        #262c33;

      color:
        #e7c15a;

      white-space:
        nowrap;
    }


    /* =========================
       その他
    ========================= */

    .loading {
      padding:
        50px;

      text-align:
        center;

      color:
        #aeb5bc;
    }

    .empty {
      padding:
        30px;

      text-align:
        center;

      color:
        #858d95;
    }

    .error-box {
      padding:
        15px;

      border:
        1px solid
        #753f3c;

      border-radius:
        10px;

      background:
        rgba(
          120,
          40,
          36,
          0.12
        );

      color:
        #ff9690;

      margin-bottom:
        20px;
    }


    @media (
      max-width: 700px
    ) {

      .container {
        width:
          min(
            100% - 18px,
            1500px
          );

        padding-top:
          18px;
      }

      .admin-header {
        align-items:
          flex-start;

        flex-direction:
          column;
      }

      h1 {
        font-size:
          27px;
      }

      .login-panel {
        margin-top:
          30px;

        padding:
          25px;
      }

      .stat-value {
        font-size:
          32px;
      }

      .toolbar {
        width:
          100%;
      }

      .toolbar input,
      .toolbar select {
        width:
          100%;
      }
    }

  </style>

</head>


<body>

  <main class="container">


    <!-- =========================
         ログイン
    ========================== -->

    <section
      id="login-screen"
      class="panel login-panel"
    >

      <div class="kicker">
        ASUKA KENZAN / ADMIN
      </div>

      <h1>
        廃人検定 管理画面
      </h1>

      <p class="muted">
        管理者アカウントでログインしてください。
      </p>


      <form
        id="login-form"
        class="login-form"
      >

        <label>

          メールアドレス

          <input
            id="admin-email"
            type="email"
            autocomplete="username"
            required
          >

        </label>


        <label>

          パスワード

          <input
            id="admin-password"
            type="password"
            autocomplete="current-password"
            required
          >

        </label>


        <button
          class="gold-button"
          type="submit"
        >
          管理画面へログイン
        </button>


        <div
          id="login-error"
          class="login-error"
        ></div>

      </form>

    </section>



    <!-- =========================
         管理画面
    ========================== -->

    <section
      id="admin-screen"
      class="hidden"
    >

      <header class="admin-header">

        <div class="admin-title">

          <div class="kicker">
            ASUKA KENZAN / ADMIN DASHBOARD
          </div>

          <h1>
            廃人検定 管理画面
          </h1>

          <div
            id="admin-user-label"
            class="muted"
          ></div>

        </div>


        <div class="header-buttons">

          <button
            id="refresh-button"
            class="secondary-button"
          >
            最新データを再読み込み
          </button>

          <button
            id="logout-button"
            class="secondary-button"
          >
            ログアウト
          </button>

        </div>

      </header>


      <div
        id="global-error"
        class="error-box hidden"
      ></div>


      <nav class="nav-tabs">

        <button
          class="tab-button active"
          data-tab="dashboard"
        >
          集計
        </button>

        <button
          class="tab-button"
          data-tab="question-stats"
        >
          問題別統計
        </button>

        <button
          class="tab-button"
          data-tab="reports"
        >
          物申す
        </button>

        <button
          class="tab-button"
          data-tab="questions"
        >
          問題一覧
        </button>

      </nav>



      <!-- =========================
           集計
      ========================== -->

      <section
        id="tab-dashboard"
        class="tab-content"
      >

        <div
          id="stats-grid"
          class="stats-grid"
        ></div>


        <section class="section">

          <div class="panel section-panel">

            <div class="section-head">

              <h2 class="section-title">
                最近の挑戦
              </h2>

              <span class="muted">
                時刻は日本時間
              </span>

            </div>


            <div
              id="sessions-table"
              class="table-wrap"
            ></div>

          </div>

        </section>

      </section>



      <!-- =========================
           問題別統計
      ========================== -->

      <section
        id="tab-question-stats"
        class="tab-content hidden"
      >

        <div class="panel section-panel">

          <div class="section-head">

            <div>

              <h2 class="section-title">
                問題別正答率
              </h2>

              <div class="section-note">
                各プレイヤーの初回回答のみで集計
              </div>

            </div>


            <div class="toolbar">

              <input
                id="question-stats-search"
                type="search"
                placeholder="問題ID・問題文で検索"
              >


              <select
                id="question-stats-category"
              >

                <option value="">
                  全カテゴリ
                </option>

                <option value="モンスター">
                  モンスター
                </option>

                <option value="アイテム">
                  アイテム
                </option>

                <option value="ダンジョン">
                  ダンジョン
                </option>

                <option value="仕様">
                  仕様
                </option>

                <option value="その他">
                  その他
                </option>

              </select>


              <select
                id="question-stats-sort"
              >

                <option value="accuracy-asc">
                  正答率が低い順
                </option>

                <option value="accuracy-desc">
                  正答率が高い順
                </option>

                <option value="attempts-desc">
                  回答者数が多い順
                </option>

                <option value="difficulty-desc">
                  作者難易度が高い順
                </option>

                <option value="id-asc">
                  問題ID順
                </option>

              </select>

            </div>

          </div>


          <div
            id="question-stats-summary"
            class="section-note"
          ></div>


          <div
            id="question-stats-table"
            class="table-wrap"
          ></div>

        </div>

      </section>



      <!-- =========================
           物申す
      ========================== -->

      <section
        id="tab-reports"
        class="tab-content hidden"
      >

        <div class="panel section-panel">

          <div class="section-head">

            <h2 class="section-title">
              物申す一覧
            </h2>

            <span
              id="report-count"
              class="question-count"
            ></span>

          </div>


          <div
            id="reports-list"
          ></div>

        </div>

      </section>



      <!-- =========================
           問題一覧
      ========================== -->

      <section
        id="tab-questions"
        class="tab-content hidden"
      >

        <div class="panel section-panel">

          <div class="section-head">

            <div>

              <h2 class="section-title">
                問題一覧
              </h2>

              <div
                id="question-count"
                class="question-count"
              ></div>

            </div>


            <div class="toolbar">

              <input
                id="question-search"
                type="search"
                placeholder="問題ID・本文・カテゴリで検索"
              >

            </div>

          </div>


          <div
            id="questions-table"
            class="table-wrap"
          ></div>

        </div>

      </section>

    </section>

  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <script>

    /* =========================
       Supabase
    ========================= */

    const SUPABASE_URL =
      "https://eiseszhremqmeodxbcuc.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_1mtFdVK6HheU4pVZ7D2wxg_7tb_9PDO";


    const adminClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {

          auth: {

            storageKey:
              "asuka-haijin-admin-auth",

            persistSession:
              true,

            autoRefreshToken:
              true,

            detectSessionInUrl:
              false
          }
        }
      );



    /* =========================
       DOM
    ========================= */

    const loginScreen =
      document.querySelector(
        "#login-screen"
      );

    const adminScreen =
      document.querySelector(
        "#admin-screen"
      );

    const loginForm =
      document.querySelector(
        "#login-form"
      );

    const emailInput =
      document.querySelector(
        "#admin-email"
      );

    const passwordInput =
      document.querySelector(
        "#admin-password"
      );

    const loginError =
      document.querySelector(
        "#login-error"
      );

    const logoutButton =
      document.querySelector(
        "#logout-button"
      );

    const refreshButton =
      document.querySelector(
        "#refresh-button"
      );

    const adminUserLabel =
      document.querySelector(
        "#admin-user-label"
      );

    const globalError =
      document.querySelector(
        "#global-error"
      );

    const statsGrid =
      document.querySelector(
        "#stats-grid"
      );

    const sessionsTable =
      document.querySelector(
        "#sessions-table"
      );

    const reportsList =
      document.querySelector(
        "#reports-list"
      );

    const reportCount =
      document.querySelector(
        "#report-count"
      );

    const questionsTable =
      document.querySelector(
        "#questions-table"
      );

    const questionCount =
      document.querySelector(
        "#question-count"
      );

    const questionSearch =
      document.querySelector(
        "#question-search"
      );

    const questionStatsTable =
      document.querySelector(
        "#question-stats-table"
      );

    const questionStatsSummary =
      document.querySelector(
        "#question-stats-summary"
      );

    const questionStatsSearch =
      document.querySelector(
        "#question-stats-search"
      );

    const questionStatsCategory =
      document.querySelector(
        "#question-stats-category"
      );

    const questionStatsSort =
      document.querySelector(
        "#question-stats-sort"
      );


    let allQuestions =
      [];

    let allQuestionStats =
      [];



    /* =========================
       起動
    ========================= */

    boot();


    async function boot() {

      const {
        data
      } =

        await adminClient
          .auth
          .getSession();


      if (
        !data.session
      ) {

        showLogin();

        return;
      }


      const allowed =
        await checkAdmin();


      if (
        !allowed
      ) {

        await adminClient
          .auth
          .signOut();


        showLogin();

        return;
      }


      showAdmin();

      await loadAllData();
    }



    /* =========================
       ログイン
    ========================= */

    loginForm.addEventListener(
      "submit",
      async function (
        event
      ) {

        event.preventDefault();


        loginError.textContent =
          "";


        const email =
          emailInput.value.trim();


        const password =
          passwordInput.value;


        const submitButton =
          loginForm.querySelector(
            "button[type='submit']"
          );


        submitButton.disabled =
          true;


        submitButton.textContent =
          "ログイン中...";


        try {

          const {
            error
          } =

            await adminClient
              .auth
              .signInWithPassword(
                {

                  email:
                    email,

                  password:
                    password
                }
              );


          if (
            error
          ) {

            throw error;
          }


          const allowed =
            await checkAdmin();


          if (
            !allowed
          ) {

            await adminClient
              .auth
              .signOut();


            throw new Error(
              "このアカウントには管理者権限がありません。"
            );
          }


          passwordInput.value =
            "";


          showAdmin();

          await loadAllData();


        } catch (
          error
        ) {

          console.error(
            error
          );


          loginError.textContent =
            error.message ||
            "ログインできませんでした。";


        } finally {

          submitButton.disabled =
            false;


          submitButton.textContent =
            "管理画面へログイン";
        }
      }
    );



    /* =========================
       管理者確認
    ========================= */

    async function checkAdmin() {

      const {
        data: {
          user
        },
        error:
          userError
      } =

        await adminClient
          .auth
          .getUser();


      if (
        userError ||
        !user
      ) {

        return false;
      }


      const {
        data,
        error
      } =

        await adminClient
          .from(
            "admin_users"
          )
          .select(
            "user_id"

    /* =========================
       全件取得
    ========================= */

    async function fetchAllRows(
      table,
      columns
    ) {

      const pageSize =
        1000;


      let from =
        0;


      const rows =
        [];


      while (
        true
      ) {

        const {
          data,
          error
        } =

          await adminClient
            .from(
              table
            )
            .select(
              columns
            )
            .range(
              from,
              from +
              pageSize -
              1
            );


        if (
          error
        ) {

          throw error;
        }


        rows.push(
          ...data
        );


        if (
          data.length <
            pageSize
        ) {

          break;
        }


        from +=
          pageSize;
      }


      return rows;
    }

    /* =========================
       問題別統計作成
    ========================= */

    function buildQuestionStats(
      questions,
      firstAnswers
    ) {

      const statsMap =
        new Map();


      questions.forEach(
        function (
          question
        ) {

          statsMap.set(
            String(
              question.id
            ),
            {

              id:
                question.id,

              category:
                question.category,

              question:
                question.question,

              difficulty:
                question.difficulty_author,

              attempts:
                0,

              correct:
                0,

              accuracy:
                null
            }
          );
        }
      );


      firstAnswers.forEach(
        function (
          answer
        ) {

          const item =
            statsMap.get(
              String(
                answer.question_id
              )
            );


          if (
            !item
          ) {

            return;
          }


          item.attempts++;


          if (
            answer.is_correct
          ) {

            item.correct++;
          }
        }
      );


      statsMap.forEach(
        function (
          item
        ) {

          if (
            item.attempts >
              0
          ) {

            item.accuracy =
              item.correct /
              item.attempts *
              100;
          }
        }
      );


      return Array.from(
        statsMap.values()
      );
    }



    /* =========================
       問題別統計フィルター
    ========================= */

    questionStatsSearch.addEventListener(
      "input",
      applyQuestionStatsFilters
    );


    questionStatsCategory.addEventListener(
      "change",
      applyQuestionStatsFilters
    );


    questionStatsSort.addEventListener(
      "change",
      applyQuestionStatsFilters
    );


    function applyQuestionStatsFilters() {

      const keyword =
        questionStatsSearch
          .value
          .trim()
          .toLowerCase();


      const category =
        questionStatsCategory.value;


      const sort =
        questionStatsSort.value;


      let rows =
        allQuestionStats.filter(
          function (
            item
          ) {

            if (
              category &&
              item.category !==
                category
            ) {

              return false;
            }


            if (
              keyword
            ) {

              const text =
                [
                  item.id,
                  item.category,
                  item.question
                ]
                  .join(
                    " "
                  )
                  .toLowerCase();


              if (
                !text.includes(
                  keyword
                )
              ) {

                return false;
              }
            }


            return true;
          }
        );


      rows =
        [...rows];


      if (
        sort ===
          "accuracy-asc"
      ) {

        rows.sort(
          function (
            a,
            b
          ) {

            if (
              a.accuracy ===
                null &&
              b.accuracy ===
                null
            ) {

              return (
                Number(a.id) -
                Number(b.id)
              );
            }


            if (
              a.accuracy ===
                null
            ) {

              return 1;
            }


            if (
              b.accuracy ===
                null
            ) {

              return -1;
            }


            return (
              a.accuracy -
              b.accuracy
            );
          }
        );


      } else if (
        sort ===
          "accuracy-desc"
      ) {

        rows.sort(
          function (
            a,
            b
          ) {

            if (
              a.accuracy ===
                null
            ) {

              return 1;
            }


            if (
              b.accuracy ===
                null
            ) {

              return -1;
            }


            return (
              b.accuracy -
              a.accuracy
            );
          }
        );


      } else if (
        sort ===
          "attempts-desc"
      ) {

        rows.sort(
          function (
            a,
            b
          ) {

            return (
              b.attempts -
              a.attempts
            );
          }
        );


      } else if (
        sort ===
          "difficulty-desc"
      ) {

        rows.sort(
          function (
            a,
            b
          ) {

            return (
              Number(
                b.difficulty ||
                0
              ) -
              Number(
                a.difficulty ||
                0
              )
            );
          }
        );


      } else {

        rows.sort(
          function (
            a,
            b
          ) {

            return (
              Number(a.id) -
              Number(b.id)
            );
          }
        );
      }


      renderQuestionStats(
        rows
      );
    }

    function formatAccuracy(
      value
    ) {

      const rounded =
        Math.round(
          value *
          10
        ) /
        10;


      if (
        Number.isInteger(
          rounded
        )
      ) {

        return String(
          rounded
        );
      }


      return rounded.toFixed(
        1
      );
    }



    function getAccuracyClass(
      value
    ) {

      if (
        value ===
          null
      ) {

        return "accuracy-none";
      }


      if (
        value <
          40
      ) {

        return "accuracy-low";
      }


      if (
        value <
          70
      ) {

        return "accuracy-mid";
      }


      return "accuracy-high";
    }



    /* =========================

    function renderReports(

    ) {

            function (
              question
            ) {

              return [
                String(

                ),
                question
              ];
            }
          )
        );

        [...reports]
          .sort(

              b
            ) {

              return (
                new Date(
                  getReportDate(

                ) -
                new Date(
                  getReportDate(
                    a
                  ) ||
                  0
                )
              );
            }
          );


      reportCount.textContent =
        `${sorted.length}件`;

        reportsList.innerHTML =

                      )}

                        report.user_id
                      )}

    function getReportDate(
      report
    ) {

      return (
        report.created_at ||
        report.reported_at ||
        report.submitted_at ||
        null
      );
    }



    function translateReportType(
      value
    ) {

      const map = {

        wrong_answer:
          "正解が違う",

        insufficient_condition:
          "条件が不足",

        alternate_answer:
          "別解がある",

        explanation_error:
          "解説が不正確",

        other:
          "その他"
      };


      return (
        map[value] ||
        value ||
        "-"
      );
    }



    /* =========================
       問題一覧検索
    ========================= */

    questionSearch.addEventListener(
      "input",
      function () {

        const keyword =
          questionSearch
            .value
            .trim()
            .toLowerCase();


        if (
          !keyword
        ) {

          renderQuestions(
            allQuestions
          );

          return;
        }


        const filtered =
          allQuestions.filter(
            function (
              question
            ) {

              const text =
                [

                  question.id,

                  question.category,

                  question.type,

                  question.question,

                  question.verification,

                  question.production_stage

                ]
                  .join(
                    " "
                  )
                  .toLowerCase();


              return text.includes(
                keyword
              );
            }
          );


        renderQuestions(
          filtered,
          allQuestions.length
        );
      }
    );



    /* =========================
       問題一覧
    ========================= */

    function renderQuestions(
      questions,
      total = null
    ) {

      questionCount.textContent =
        total ===
          null

          ? `全${questions.length}問`

          : `${questions.length} / ${total}問`;


      if (
        questions.length ===
          0
      ) {

        questionsTable.innerHTML =
          `<div class="empty">該当する問題はありません。</div>`;

        return;
      }


      questionsTable.innerHTML = `

        <table>

          <thead>

            <tr>

              <th>ID</th>

              <th>カテゴリ</th>

              <th>種類</th>

              <th>問題文</th>

              <th>難易度</th>

              <th>検証</th>

              <th>制作段階</th>

            </tr>

          </thead>


          <tbody>

            ${questions
              .map(
                function (
                  question
                ) {

                  return `

                    <tr>

                      <td>
                        #${escapeHtml(
                          question.id
                        )}
                      </td>

                      <td>

                        <span class="category-badge">

                          ${escapeHtml(
                            question.category
                          )}

                        </span>

                      </td>

                      <td>

                        ${
                          question.type ===
                            "multiple"

                            ? "複数選択"

                            : "単一選択"
                        }

                      </td>

                      <td class="question-text">

                        ${escapeHtml(
                          question.question
                        )}

                      </td>

                      <td>

                        ${
                          question.difficulty_author ??
                          "-"
                        }

                      </td>

                      <td>

                        ${escapeHtml(
                          question.verification ||
                          "-"
                        )}

                      </td>

                      <td>

                        ${escapeHtml(
                          question.production_stage ||
                          "-"
                        )}

                      </td>

                    </tr>

                  `;
                }
              )
              .join("")}

          </tbody>

        </table>

      `;
    }



    /* =========================
       JST
    ========================= */

    function formatJst(
      value
    ) {

      if (
        !value
      ) {

        return "-";
      }


      const date =
        new Date(
          value
        );


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return "-";
      }


      return new Intl.DateTimeFormat(
        "ja-JP",
        {

          timeZone:
            "Asia/Tokyo",

          year:
            "numeric",

          month:
            "2-digit",

          day:
            "2-digit",

          hour:
            "2-digit",

          minute:
            "2-digit",

          second:
            "2-digit",

          hour12:
            false
        }
      ).format(
        date
      );
    }



    /* =========================
       その他
    ========================= */

    function shortId(
      value
    ) {

      if (
        !value
      ) {

        return "-";
      }


      const text =
        String(
          value
        );


      if (
        text.length <=
          12
      ) {

        return text;
      }


      return (
        text.slice(
          0,
          8
        ) +
        "…"
      );
    }



    function escapeHtml(
      value
    ) {

      return String(
        value ??
        ""
      )

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );
    }



    function showGlobalError(
      message
    ) {

      globalError.textContent =
        message;


      globalError
        .classList
        .remove(
          "hidden"
        );
    }



    function hideGlobalError() {

      globalError.textContent =
        "";


      globalError
        .classList
        .add(
          "hidden"
        );
    }

  </script>

</body>
