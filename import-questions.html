<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>問題データ移行</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: grid;
      place-items: center;

      background: #101419;
      color: #f4f4f4;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    }

    .card {
      width:
        min(
          700px,
          calc(100% - 30px)
        );

      padding: 32px;

      border:
        1px solid #4a4024;

      border-radius: 18px;

      background: #171c21;
    }

    h1 {
      margin-top: 0;
    }

    .note {
      color: #aeb5bc;
      line-height: 1.7;
    }

    button {
      width: 100%;

      margin-top: 20px;

      padding: 15px;

      border: 0;
      border-radius: 10px;

      background: #e4b63c;
      color: #17130a;

      font-size: 16px;
      font-weight: 900;

      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #result {
      margin-top: 20px;

      padding: 15px;

      border-radius: 10px;

      background: #11151a;

      white-space: pre-wrap;

      line-height: 1.7;
    }

    .success {
      color: #75dc95;
    }

    .error {
      color: #ff7b74;
    }

  </style>

</head>


<body>

  <main class="card">

    <h1>
      問題データ一括移行
    </h1>

    <p class="note">
      data/questions.json の問題を
      Supabase の questions テーブルへ移行します。
      <br>
      問題IDはそのまま維持します。
      <br>
      現在の問題はすべて「公開中」として登録します。
    </p>

    <button
      id="import-button"
      type="button"
    >
      123問をSupabaseへ移行する
    </button>

    <div
      id="result"
    >
      待機中
    </div>

  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <script>

    const SUPABASE_URL =
      "https://eiseszhremqmeodxbcuc.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_1mtFdVK6HheU4pVZ7D2wxg_7tb_9PDO";


    const client =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
          auth: {
            storageKey:
              "asuka-haijin-admin-auth",

            persistSession:
              true,

            autoRefreshToken:
              true,

            detectSessionInUrl:
              false
          }
        }
      );


    const importButton =
      document.querySelector(
        "#import-button"
      );


    const result =
      document.querySelector(
        "#result"
      );


    boot();


    async function boot() {

      try {

        result.textContent =
          "管理者権限を確認しています...";


        const {
          data: {
            user
          },
          error:
            userError
        } =
          await client
            .auth
            .getUser();


        if (
          userError ||
          !user
        ) {

          throw new Error(
            "管理画面にログインしてから、このページを開いてください。"
          );
        }


        const {
          data:
            admin,
          error:
            adminError
        } =
          await client
            .from(
              "admin_users"
            )
            .select(
              "user_id"
            )
            .eq(
              "user_id",
              user.id
            )
            .maybeSingle();


        if (
          adminError
        ) {

          throw adminError;
        }


        if (
          !admin
        ) {

          throw new Error(
            "管理者権限がありません。"
          );
        }


        result.className =
          "success";


        result.textContent =
          "管理者確認OK\n「123問をSupabaseへ移行する」を押してください。";


      } catch (
        error
      ) {

        console.error(
          error
        );


        importButton.disabled =
          true;


        result.className =
          "error";


        result.textContent =
          error.message;
      }
    }



    importButton.addEventListener(
      "click",
      async function () {

        importButton.disabled =
          true;


        result.className =
          "";


        result.textContent =
          "questions.json を読み込んでいます...";


        try {

          const response =
            await fetch(
              "data/questions.json",
              {
                cache:
                  "no-store"
              }
            );


          if (
            !response.ok
          ) {

            throw new Error(
              "data/questions.json を読み込めませんでした。"
            );
          }


          const questions =
            await response.json();


          if (
            !Array.isArray(
              questions
            )
          ) {

            throw new Error(
              "questions.json の形式が不正です。"
            );
          }


          const validCategories = [
            "モンスター",
            "アイテム",
            "ダンジョン",
            "仕様",
            "その他"
          ];


          const normalized =
            questions.map(
              function (
                question,
                index
              ) {

                if (
                  question.id ===
                  undefined ||
                  question.id ===
                  null
                ) {

                  throw new Error(
                    `${index + 1}件目にIDがありません。`
                  );
                }


                if (
                  !validCategories.includes(
                    question.category
                  )
                ) {

                  throw new Error(
                    `#${question.id} のカテゴリが不正です：${question.category}`
                  );
                }


                if (
                  question.type !==
                    "single" &&
                  question.type !==
                    "multiple"
                ) {

                  throw new Error(
                    `#${question.id} のtypeが不正です。`
                  );
                }


                if (
                  !question.question
                ) {

                  throw new Error(
                    `#${question.id} に問題文がありません。`
                  );
                }


                if (
                  !Array.isArray(
                    question.choices
                  )
                ) {

                  throw new Error(
                    `#${question.id} のchoicesが配列ではありません。`
                  );
                }


                if (
                  question.answer ===
                  undefined
                ) {

                  throw new Error(
                    `#${question.id} にanswerがありません。`
                  );
                }


                return {

                  id:
                    Number(
                      question.id
                    ),

                  category:
                    question.category,

                  type:
                    question.type,

                  instruction:
                    emptyToNull(
                      question.instruction
                    ),

                  question:
                    question.question,

                  choices:
                    question.choices,

                  answer:
                    question.answer,

                  explanation:
                    emptyToNull(
                      question.explanation
                    ),

                  tags:
                    Array.isArray(
                      question.tags
                    )
                      ? question.tags
                      : [],

                  source:
                    sourceToText(
                      question.source
                    ),

                  verification:
                    emptyToNull(
                      question.verification
                    ),

                  review_status:
                    emptyToNull(
                      question.review_status
                    ),

                  audit_status:
                    emptyToNull(
                      question.audit_status
                    ),

                  quality_status:
                    emptyToNull(
                      question.quality_status
                    ),

                  audit_note:
                    emptyToNull(
                      question.audit_note
                    ),

                  audit_date:
                    emptyToNull(
                      question.audit_date
                    ),

                  production_stage:
                    emptyToNull(
                      question.production_stage
                    ),

                  is_published:
                    true
                };
              }
            );


          const ids =
            normalized.map(
              function (
                question
              ) {

                return question.id;
              }
            );


          const uniqueIds =
            new Set(
              ids
            );


          if (
            uniqueIds.size !==
            ids.length
          ) {

            throw new Error(
              "questions.json に重複した問題IDがあります。"
            );
          }


          result.textContent =
            `${normalized.length}問を確認しました。\nSupabaseへ登録しています...`;


          const batchSize =
            50;


          let imported =
            0;


          for (
            let start = 0;
            start < normalized.length;
            start += batchSize
          ) {

            const batch =
              normalized.slice(
                start,
                start +
                batchSize
              );


            const {
              data,
              error
            } =
              await client
                .from(
                  "questions"
                )
                .upsert(
                  batch,
                  {
                    onConflict:
                      "id"
                  }
                )
                .select(
                  "id"
                );


            if (
              error
            ) {

              throw error;
            }


            imported +=
              data.length;


            result.textContent =
              `${imported} / ${normalized.length}問 登録済み...`;
          }


          const {
            count,
            error:
              countError
          } =
            await client
              .from(
                "questions"
              )
              .select(
                "*",
                {
                  count:
                    "exact",

                  head:
                    true
                }
              );


          if (
            countError
          ) {

            throw countError;
          }


          result.className =
            "success";


          result.textContent =
            `移行成功！\n\n` +
            `JSON：${normalized.length}問\n` +
            `Supabase questions：${count}問\n\n` +
            `次はID自動採番を #124 以降に合わせます。`;


        } catch (
          error
        ) {

          console.error(
            error
          );


          result.className =
            "error";


          result.textContent =
            "移行に失敗しました。\n\n" +
            (
              error.message ||
              String(
                error
              )
            );


        } finally {

          importButton.disabled =
            false;
        }
      }
    );



    function emptyToNull(
      value
    ) {

      if (
        value ===
        undefined ||
        value ===
        null ||
        value ===
        ""
      ) {

        return null;
      }


      return value;
    }



    function sourceToText(
      value
    ) {

      if (
        value ===
        undefined ||
        value ===
        null ||
        value ===
        ""
      ) {

        return null;
      }


      if (
        typeof value ===
        "string"
      ) {

        return value;
      }


      return JSON.stringify(
        value
      );
    }

  </script>

</body>

</html>
