<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>アスカ見参 廃人検定</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <section class="quiz-card hero-card">

      <p class="hero-label">ASUKA KENZAN / HAIJIN TEST</p>

      <h1>アスカ見参　廃人検定</h1>

      <p class="hero-catch">
        にわか知識では、まず通用しない。<br>
        あなたは本当にアスカを理解しているか？
      </p>

      <p class="subtitle">
        全1000問の問題バンクから、毎回ランダムで100問を出題。<br>
        白蛇、裏白、特殊MH、杖反射、状態異常、処理順、例外仕様――。<br>
        「知っているつもり」を容赦なく暴く、アスカ見参ガチ勢向け検定です。
      </p>

      <p class="hero-warning">
        クリア回数だけでは語れない。<br>
        知識と理解で、本物かどうかがバレる。
      </p>

      <div class="hero-buttons">
        <button class="start-button">検定に挑戦する</button>
      </div>

    </section>

  </main>

  <script src="app.js"></script>

</body>
</html>
