<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>結果画面テスト</title><style>body{font-family:sans-serif;background:#151515;color:#fff;margin:0;padding:24px}.wrap{max-width:1100px;margin:auto}.menu,.result{background:#1d1d1d;border:1px solid #5d4c1d;border-radius:22px;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.grid button,.back{padding:14px;border-radius:10px;border:1px solid #7a6328;background:#282828;color:#fff;font-weight:800;cursor:pointer}.grid strong,.title,.score{color:#f0c94f}.manual{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.manual input{width:90px;padding:10px}.manual button,.back{background:#f0c94f;color:#111}.result{display:none;text-align:center}.score{font-size:70px;font-weight:900}.grade{font-size:48px;font-weight:900;margin-top:28px}.title{font-size:40px;font-weight:900;margin:8px 0 24px}.comment{max-width:850px;margin:auto;line-height:1.9;font-size:18px}.comment p{margin:0 0 12px}</style></head><body><div class="wrap"><section class="menu" id="menu"><h1>結果画面テスト</h1><p>ランクを押すだけで、そのランクの最低点を即表示します。</p><div class="grid"><button data-score="0"><strong>D</strong><br>0点</button><button data-score="20"><strong>D+</strong><br>20点</button><button data-score="35"><strong>C−</strong><br>35点</button><button data-score="40"><strong>C</strong><br>40点</button><button data-score="50"><strong>C+</strong><br>50点</button><button data-score="60"><strong>B−</strong><br>60点</button><button data-score="65"><strong>B</strong><br>65点</button><button data-score="70"><strong>B+</strong><br>70点</button><button data-score="75"><strong>A−</strong><br>75点</button><button data-score="80"><strong>A</strong><br>80点</button><button data-score="85"><strong>A+</strong><br>85点</button><button data-score="90"><strong>S</strong><br>90点</button><button data-score="95"><strong>S+</strong><br>95点</button><button data-score="99"><strong>SS</strong><br>99点</button><button data-score="100"><strong>SSS</strong><br>100点</button></div><div class="manual"><label>任意スコア：</label><input id="manual" type="number" min="0" max="100" value="95"><button id="manualBtn">表示</button></div></section><section class="result" id="result"><p>RESULT</p><h1>検定結果</h1><div class="score"><span id="score">95</span> <small style="font-size:.4em;color:#bbb">/ 100</small></div><p>正答率 <span id="pct">95</span>%</p><p>あなたのランク・称号</p><div class="grade" id="grade">S+</div><div class="title" id="title">アスカ星人</div><div class="comment" id="comment"></div><button class="back" id="back">テストメニューへ戻る</button></section></div><script>
const ranks=[
[100,'SSS','廃人',`<p>100問、全問正解。</p><p>おめでとうございます。</p><p>あなたは本検定において、正式に「廃人」と認定されました。</p><p>その膨大な知識と、アスカ見参に捧げてきた情熱と時間に、心から敬意を表します。</p><p>なお、この称号を取得しても、社会的地位が向上することは一切ありません。</p><p><strong>廃人認定、本当におめでとうございます。</strong></p>`],
[99,'SS','開発者ですか？',`<p>ちょっと待ってください。</p><p>なぜそこまで知っているのですか？</p><p>普通にプレイしていて知るはずのないような仕様まで把握していますね。</p><p>念のため、スタッフロールにあなたの名前が載っていないか確認させてください。</p><p>もし開発に関わっていないのだとしたら、なおさら問題です。</p><p><strong>あなたはいったい、何者なのですか？</strong></p>`],
[95,'S+','アスカ星人',`<p>おめでとうございます。</p><p>あなたのアスカ知識は、地球人の常識を大きく逸脱しています。</p><p>この結果を受け、検定委員会では、あなたが本当に地球人なのか慎重に調査する必要があると判断しました。</p><p>なお、本人は地球生まれと主張している模様です。</p><p>現時点では宇宙人であるという決定的な証拠は見つかっていませんが、引き続き警戒を続けます。</p><p><strong>どうか地球の平和を脅かさないようお願いします。</strong></p>`],
[90,'S','生けるアスカWiki',`<p>攻略Wikiを開く必要はありません。あなたに聞けばいいのです。</p><p>モンスターの特性から、誰も気にしないような細かい仕様まで、頭の中に詰め込まれています。</p><p>もはや歩く攻略データベースです。</p><p>その記憶力を別のことに使っていれば、どんな人生だったのでしょうか。</p><p><strong>残念ながら、その可能性を検証することはもうできません。</strong></p>`],
[85,'A+','フェイに問題を出すレベル',`<p>もはやフェイから問題を出されるだけでは満足できないでしょう。</p><p>今度はあなたが出題する番です。</p><p>その豊富な知識を生かして、ぜひ難問を作ってみてください。</p><p>ただし、問題がマニアックすぎて誰も正解できず、企画そのものが成立しなくなる恐れがあります。</p><p><strong>出題者には、ある程度の良識も必要です。</strong></p>`],
[80,'A','アスカ見参博士（自称）',`<p>あなたの知識は相当なものです。</p><p>研究論文はありません。学位もありません。誰も認定していません。</p><p>それでもアスカ見参について語り始めたら止まらないので、周囲はもう博士と呼ぶしかありません。</p><p>ただし、その知識を披露できる場は極めて限られています。</p><p><strong>今後も数少ない発表の機会を大切にしてください。</strong></p>`],
[75,'A−','アスカ見参で飯が食える',`<p>三度の飯よりアスカを選び続けた結果、とうとうアスカで飯が食えるほどの知識を身につけました。</p><p>長年の努力が報われた瞬間です。</p><p>なお、この知識をどこで換金できるのかは、現在も調査中です。</p><p><strong>当面は本業を続けることをおすすめします。</strong></p>`],
[70,'B+','履歴書に書けるレベル',`<p>特技欄に「アスカ見参」と書いても、もはや嘘ではありません。</p><p>これだけの知識があれば、立派な専門家です。</p><p>ただし、面接官がその価値を理解してくれる可能性は極めて低いでしょう。</p><p>なお、採用担当者から「それは仕事にどう役立ちますか？」と質問された場合の回答は、各自でご用意ください。</p>`],
[65,'B','生粋のアスカっ子',`<p>「まだアスカなんかやってるの？」</p><p>そんな言葉を何度聞いたことでしょう。</p><p>しかし、あなたにとっては、アスカをやっていない人のほうが不思議なのです。</p><p>流行りのゲームには目もくれず、今日も元気にダンジョンへ。</p><p>もう普通の人とは少し違う世界に住んでいます。</p>`],
[60,'B−','アスカ見参依存症',`<p>「今日はちょっとだけ遊ぼう」</p><p>そう思って起動したはずが、気づけば数時間。</p><p>何度も引退を考えたことでしょう。しかし、いつの間にかまたダンジョンに潜っています。</p><p>どうやら、症状はかなり進行しているようです。</p><p>ただ、ご安心ください。アスカ見参をやめれば改善します。</p><p><strong>もっとも、それができるなら苦労していません。</strong></p>`],
[50,'C+','三度の飯よりアスカ好き',`<p>食事を忘れてアスカをプレイした夜もあったでしょう。</p><p>しかし、残念ながら愛情だけでは解けない問題もあるようです。</p><p>アスカ愛は十分伝わりましたので、そろそろご飯を食べてください。</p>`],
[40,'C','アスカの話になると急に早口',`<p>普段はおとなしいのに、アスカの話題が出た瞬間、急に早口になるタイプですね。</p><p>聞かれてもいないのに、アイテムの使い方やモンスターの特性を延々と説明してしまいます。</p><p>ただし、マニアックな仕様について質問されると、急に声が小さくなる傾向があります。</p>`],
[35,'C−','攻略Wikiが愛読書',`<p>アスカの攻略Wikiを眺めているだけで、気がつけば数時間。</p><p>普通の人にとっては意味不明な数字の羅列も、あなたにとっては極上の読み物です。</p><p>ただし、読んだ内容をどれだけ覚えているかは別問題のようです。</p>`],
[20,'D+','アスカ見参を知っている人',`<p>「アスカ見参」というゲームを知っている。それだけでも今の時代では立派な希少種です。</p><p>問題文が何を言っているのかわからなかった？</p><p>大丈夫です。それが普通の反応です。</p>`],
[0,'D','まだ人間',`<p>おめでとうございます。あなたはまだ人間です。</p><p>アスカ見参の知識に脳の容量を奪われていない、極めて健全な状態です。</p><p>このまま普通の人生を歩むことをおすすめします。</p>`]
];
const menu=document.getElementById('menu'),result=document.getElementById('result');
function showResult(score){score=Math.max(0,Math.min(100,Number(score)));const r=ranks.find(x=>score>=x[0]);document.getElementById('score').textContent=score;document.getElementById('pct').textContent=score;document.getElementById('grade').textContent=r[1];document.getElementById('title').textContent=r[2];document.getElementById('comment').innerHTML=r[3];menu.style.display='none';result.style.display='block';window.scrollTo(0,0)}
document.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>showResult(b.dataset.score));document.getElementById('manualBtn').onclick=()=>showResult(document.getElementById('manual').value);document.getElementById('back').onclick=()=>{result.style.display='none';menu.style.display='block';window.scrollTo(0,0)};
</script></body></html>
