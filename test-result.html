<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    アスカ見参 廃人検定｜結果画面テスト
  </title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&family=Reggae+One&family=Shippori+Mincho+B1:wght@500;600;700;800&family=Yuji+Syuku&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    .test-menu {
      width:
        min(
          1100px,
          92%
        );

      margin:
        40px auto;

      padding:
        32px;

      border:
        1px solid
        rgba(
          212,
          175,
          55,
          0.28
        );

      border-radius:
        20px;

      background:
        #181a1d;

      color:
        #f5f5f5;
    }


    .test-menu h1 {
      margin:
        0 0
        10px;

      font-family:
        "Noto Sans JP",
        sans-serif;

      font-size:
        30px;

      font-weight:
        900;
    }


    .test-menu-description {
      margin:
        0;

      color:
        #aaa;

      font-family:
        "Noto Sans JP",
        sans-serif;

      line-height:
        1.8;
    }


    .completion-test-button {
      display:
        block;

      width:
        100%;

      margin-top:
        24px;

      padding:
        18px 20px;

      border:
        1px solid
        rgba(
          240,
          210,
          109,
          0.55
        );

      border-radius:
        12px;

      background:
        linear-gradient(
          135deg,
          rgba(185, 133, 31, 0.9),
          rgba(240, 210, 109, 0.95)
        );

      color:
        #171717;

      font-family:
        "Noto Sans JP",
        sans-serif;

      font-size:
        18px;

      font-weight:
        900;

      cursor:
        pointer;
    }


    .completion-test-sub {
      display:
        block;

      margin-top:
        4px;

      font-size:
        12px;

      font-weight:
        700;

      opacity:
        0.72;
    }


    .test-rank-grid {
      display:
        grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(
            120px,
            1fr
          )
        );

      gap:
        10px;

      margin-top:
        24px;
    }


    .test-rank-button {
      padding:
        14px 10px;

      border:
        1px solid
        rgba(
          212,
          175,
          55,
          0.28
        );

      border-radius:
        10px;

      background:
        rgba(
          255,
          255,
          255,
          0.035
        );

      color:
        #eee;

      font-family:
        "Noto Sans JP",
        sans-serif;

      font-size:
        14px;

      font-weight:
        700;

      cursor:
        pointer;
    }


    .test-rank-button:hover {
      border-color:
        #f0d26d;

      background:
        rgba(
          212,
          175,
          55,
          0.08
        );
    }


    .test-rank-button strong {
      display:
        block;

      margin-bottom:
        4px;

      color:
        #f0d26d;

      font-size:
        20px;

      font-weight:
        900;
    }


    .test-manual {
      display:
        flex;

      align-items:
        center;

      flex-wrap:
        wrap;

      gap:
        10px;

      margin-top:
        22px;

      font-family:
        "Noto Sans JP",
        sans-serif;
    }


    .test-manual input {
      width:
        90px;

      padding:
        10px;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.18
        );

      border-radius:
        8px;

      background:
        #111;

      color:
        #fff;

      font-family:
        inherit;

      font-size:
        16px;
    }


    .test-manual button {
      padding:
        10px 18px;

      border:
        0;

      border-radius:
        8px;

      background:
        #f0d26d;

      color:
        #111;

      font-family:
        "Noto Sans JP",
        sans-serif;

      font-size:
        14px;

      font-weight:
        900;

      cursor:
        pointer;
    }


    .test-result-container[hidden],
    .test-menu[hidden] {
      display:
        none !important;
    }


    @media (
      max-width:
      700px
    ) {

      .test-menu {
        margin:
          20px auto;

        padding:
          22px 18px;
      }


      .test-menu h1 {
        font-size:
          24px;
      }


      .test-rank-grid {
        grid-template-columns:
          repeat(
            3,
            1fr
          );
      }


      .completion-test-button {
        font-size:
          16px;
      }
    }

  </style>
</head>


<body>

  <section
    class="test-menu"
    id="test-menu"
  >

    <h1>
      結果画面テスト
    </h1>


    <p
      class="test-menu-description"
    >
      ここは結果テストの入口だけです。<br>
      結果表示・ランクコメント・X共有・共有画像生成は、
      すべて本番と同じ app.js の処理を実行します。
    </p>


    <button
      class="completion-test-button"
      id="completion-test-button"
      type="button"
    >
      100問完走画面を確認

      <span
        class="completion-test-sub"
      >
        69点・「100問完走」バッジ付きで表示
      </span>
    </button>


    <div
      class="test-rank-grid"
    >

      <button class="test-rank-button" data-score="0"><strong>D</strong>0点</button>
      <button class="test-rank-button" data-score="20"><strong>D+</strong>20点</button>
      <button class="test-rank-button" data-score="35"><strong>C−</strong>35点</button>
      <button class="test-rank-button" data-score="40"><strong>C</strong>40点</button>
      <button class="test-rank-button" data-score="50"><strong>C+</strong>50点</button>
      <button class="test-rank-button" data-score="60"><strong>B−</strong>60点</button>
      <button class="test-rank-button" data-score="65"><strong>B</strong>65点</button>
      <button class="test-rank-button" data-score="70"><strong>B+</strong>70点</button>
      <button class="test-rank-button" data-score="75"><strong>A−</strong>75点</button>
      <button class="test-rank-button" data-score="80"><strong>A</strong>80点</button>
      <button class="test-rank-button" data-score="85"><strong>A+</strong>85点</button>
      <button class="test-rank-button" data-score="90"><strong>S</strong>90点</button>
      <button class="test-rank-button" data-score="95"><strong>S+</strong>95点</button>
      <button class="test-rank-button" data-score="99"><strong>SS</strong>99点</button>
      <button class="test-rank-button" data-score="100"><strong>SSS</strong>100点</button>

    </div>


    <div
      class="test-manual"
    >

      <label
        for="manual-score"
      >
        任意スコア：
      </label>


      <input
        id="manual-score"
        type="number"
        min="0"
        max="100"
        value="69"
      >


      <button
        id="manual-button"
        type="button"
      >
        表示
      </button>

    </div>

  </section>


  <main
    class="container test-result-container"
    id="test-result-container"
    hidden
  >

    <section
      class="quiz-card hero-card"
    >
    </section>

  </main>


  <script>

    (function () {

      const params =
        new URLSearchParams(
          window.location.search
        );


      const isResultTest =
        params.get(
          "resulttest"
        ) ===
          "1";


      const menu =
        document.getElementById(
          "test-menu"
        );


      const resultContainer =
        document.getElementById(
          "test-result-container"
        );


      if (
        isResultTest
      ) {

        menu.hidden =
          true;

        resultContainer.hidden =
          false;
      }


      function openResultTest(
        score,
        completion =
          false
      ) {

        const next =
          new URL(
            window.location.href
          );


        next.search =
          "";

        next.searchParams.set(
          "resulttest",
          "1"
        );

        next.searchParams.set(
          "score",
          String(
            score
          )
        );


        if (
          completion
        ) {

          next.searchParams.set(
            "completion",
            "1"
          );
        }


        window.location.href =
          next.toString();
      }


      document
        .getElementById(
          "completion-test-button"
        )
        .addEventListener(
          "click",
          function () {

            openResultTest(
              69,
              true
            );
          }
        );


      document
        .querySelectorAll(
          "[data-score]"
        )
        .forEach(
          function (
            button
          ) {

            button.addEventListener(
              "click",
              function () {

                openResultTest(
                  Number(
                    button.dataset.score
                  )
                );
              }
            );
          }
        );


      function openManualScore() {

        const value =
          Number(
            document
              .getElementById(
                "manual-score"
              )
              .value
          );


        if (
          !Number.isFinite(
            value
          ) ||
          value <
            0 ||
          value >
            100
        ) {

          alert(
            "0〜100の点数を入力してください。"
          );

          return;
        }


        openResultTest(
          Math.round(
            value
          )
        );
      }


      document
        .getElementById(
          "manual-button"
        )
        .addEventListener(
          "click",
          openManualScore
        );


      document
        .getElementById(
          "manual-score"
        )
        .addEventListener(
          "keydown",
          function (
            event
          ) {

            if (
              event.key ===
                "Enter"
            ) {

              openManualScore();
            }
          }
        );

    })();

  </script>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script
    src="rank.js"
  ></script>

  <script
    src="app.js"
  ></script>

</body>

</html>
