<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アスカ見参 廃人検定｜結果画面テスト</title>
  <style>
    body{font-family:sans-serif;background:#151515;color:#fff;margin:0;padding:24px}
    .wrap{max-width:1100px;margin:auto}
    .menu,.result{background:#1d1d1d;border:1px solid #5d4c1d;border-radius:22px;padding:28px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:20px}
    .grid button,.back{padding:14px;border-radius:10px;border:1px solid #7a6328;background:#282828;color:#fff;font-weight:800;cursor:pointer}
    .grid button:hover{border-color:#f0c94f}
    .grid strong,.title,.score{color:#f0c94f}
    .manual{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .manual input{width:90px;padding:10px;font-size:16px}
    .manual button,.back{background:#f0c94f;color:#111}
    .result{display:none;text-align:center}
    .result-label{color:#f0c94f;font-weight:900;letter-spacing:.15em}
    .score{font-size:70px;font-weight:900;margin-top:20px}
    .score small{font-size:.4em;color:#bbb}
    .rank-label{margin-top:36px;color:#bbb}
    .grade{font-size:48px;font-weight:900;margin-top:10px}
    .title{font-size:40px;font-weight:900;margin:8px 0 24px}
    .comment{max-width:850px;margin:auto;line-height:1.9;font-size:18px}
    .comment p{margin:0 0 12px}
    .back{margin-top:30px}
    @media(max-width:600px){body{padding:12px}.menu,.result{padding:20px}.score{font-size:52px}.grade{font-size:40px}.title{font-size:32px}.comment{font-size:16px;text-align:left}}
  </style>
</head>
<body>
  <div class="wrap">
    <section class="menu" id="menu">
      <h1>結果画面テスト</h1>
      <p>ランクを押すだけで、そのランクの最低点の結果を即表示します。</p>

      <div class="grid">
        <button data-score="0"><strong>D</strong><br>0点</button>
        <button data-score="20"><strong>D+</strong><br>20点</button>
        <button data-score="35"><strong>C−</strong><br>35点</button>
        <button data-score="40"><strong>C</strong><br>40点</button>
        <button data-score="50"><strong>C+</strong><br>50点</button>
        <button data-score="60"><strong>B−</strong><br>60点</button>
        <button data-score="65"><strong>B</strong><br>65点</button>
        <button data-score="70"><strong>B+</strong><br>70点</button>
        <button data-score="75"><strong>A−</strong><br>75点</button>
        <button data-score="80"><strong>A</strong><br>80点</button>
        <button data-score="85"><strong>A+</strong><br>85点</button>
        <button data-score="90"><strong>S</strong><br>90点</button>
        <button data-score="95"><strong>S+</strong><br>95点</button>
        <button data-score="99"><strong>SS</strong><br>99点</button>
        <button data-score="100"><strong>SSS</strong><br>100点</button>
      </div>

      <div class="manual">
        <label for="manual">任意スコア：</label>
        <input id="manual" type="number" min="0" max="100" value="95">
        <button id="manualBtn">表示</button>
      </div>
    </section>

    <section class="result" id="result">
      <p class="result-label">RESULT</p>
      <h1>検定結果</h1>
      <div class="score"><span id="score">95</span> <small>/ 100</small></div>
      <p>正答率 <span id="pct">95</span>%</p>
      <p class="rank-label">あなたのランク・称号</p>
      <div class="grade" id="grade">S+</div>
      <div class="title" id="title">アスカ星人</div>
      <div class="comment" id="comment"></div>
      <button class="back" id="back">テストメニューへ戻る</button>
    </section>
  </div>

  <!-- 本番と共通のランク判定 -->
  <script src="rank.js"></script>

  <!-- テストページ専用処理 -->
  <script>
    const menu = document.getElementById("menu");
    const result = document.getElementById("result");

    function showTestResult(score) {
      score = Number(score);

      if (Number.isNaN(score) || score < 0 || score > 100) {
        alert("0〜100の点数を入力してください。");
        return;
      }

      const rankResult = getRankResult(score);

      if (!rankResult) {
        alert("ランク情報を取得できませんでした。rank.js を確認してください。");
        return;
      }

      document.getElementById("score").textContent = score;
      document.getElementById("pct").textContent = score;
      document.getElementById("grade").textContent = rankResult.rank;
      document.getElementById("title").textContent = rankResult.title;
      document.getElementById("comment").innerHTML = rankResult.comment;

      menu.style.display = "none";
      result.style.display = "block";
      window.scrollTo(0, 0);
    }

    document.querySelectorAll("[data-score]").forEach((button) => {
      button.addEventListener("click", () => {
        showTestResult(button.dataset.score);
      });
    });

    document.getElementById("manualBtn").addEventListener("click", () => {
      showTestResult(document.getElementById("manual").value);
    });

    document.getElementById("manual").addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        showTestResult(event.currentTarget.value);
      }
    });

    document.getElementById("back").addEventListener("click", () => {
      result.style.display = "none";
      menu.style.display = "block";
      window.scrollTo(0, 0);
    });
  </script>
</body>
</html>
