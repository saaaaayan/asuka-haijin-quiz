<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    アスカ見参 廃人検定｜結果画面テスト
  </title>


  <!-- 本番と同じフォント -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&family=Reggae+One&family=Shippori+Mincho+B1:wght@500;600;700;800&family=Yuji+Syuku&display=swap"
    rel="stylesheet"
  >


  <!-- 本番と同じCSS -->

  <link
    rel="stylesheet"
    href="style.css"
  >


  <!-- テストページ専用 -->

  <style>

    .test-menu {
      width:
        min(
          1100px,
          92%
        );

      margin:
        40px auto;

      padding:
        32px;

      border:
        1px solid
        rgba(
          212,
          175,
          55,
          0.28
        );

      border-radius:
        20px;

      background:
        #181a1d;

      color:
        #f5f5f5;
    }


    .test-menu h1 {
      margin:
        0 0
        10px;

      font-family:
        "Noto Sans JP",
        sans-serif;

      font-size:
        30px;

      font-weight:
        900;
    }


    .test-menu-description {
      margin: 0;

      color: #aaa;

      font-family:
        "Noto Sans JP",
        sans-serif;

      line-height: 1.8;
    }


    /* =========================
       100問完走テスト
    ========================= */

    .completion-test-button {
      display: block;

      width: 100%;

      margin-top: 24px;

      padding:
        18px 20px;

      border:
        1px solid
        rgba(
          240,
          210,
          109,
          0.55
        );

      border-radius:
        12px;

      background:
        linear-gradient(
          135deg,
          rgba(185, 133, 31, 0.9),
          rgba(240, 210, 109, 0.95)
        );

      color: #171717;

      font-family:
        "Noto Sans JP",
        sans-serif;

      font-size: 18px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 8px 28px
        rgba(
          212,
          175,
          55,
          0.18
        );
    }


    .completion-test-button:hover {
      transform:
        translateY(-1px);
    }


    .completion-test-sub {
      display: block;

      margin-top: 4px;

      font-size: 12px;

      font-weight: 700;

      opacity: 0.72;
    }


    /* =========================
       ランク一覧
    ========================= */

    .test-rank-grid {
      display:
        grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(
            120px,
            1fr
          )
        );

      gap:
        10px;

      margin-top:
        24px;
    }


    .test-rank-button {
      padding:
        14px 10px;

      border:
        1px solid
        rgba(
          212,
          175,
          55,
          0.28
        );

      border-radius:
        10px;

      background:
        rgba(
          255,
          255,
          255,
          0.035
        );

      color:
        #eee;

      font-family:
        "Noto Sans JP",
        sans-serif;

      font-size:
        14px;

      font-weight:
        700;

      cursor:
        pointer;
    }


    .test-rank-button:hover {
      border-color:
        #f0d26d;

      background:
        rgba(
          212,
          175,
          55,
          0.08
        );
    }


    .test-rank-button strong {
      display:
        block;

      margin-bottom:
        4px;

      color:
        #f0d26d;

      font-size:
        20px;

      font-weight:
        900;
    }


    /* =========================
       任意点数
    ========================= */

    .test-manual {
      display:
        flex;

      align-items:
        center;

      flex-wrap:
        wrap;

      gap:
        10px;

      margin-top:
        22px;

      font-family:
        "Noto Sans JP",
        sans-serif;
    }


    .test-manual input {
      width:
        90px;

      padding:
        10px;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.18
        );

      border-radius:
        8px;

      background:
        #111;

      color:
        #fff;

      font-family:
        inherit;

      font-size:
        16px;
    }


    .test-manual button {
      padding:
        10px 18px;

      border:
        0;

      border-radius:
        8px;

      background:
        #f0d26d;

      color:
        #111;

      font-family:
        "Noto Sans JP",
        sans-serif;

      font-size:
        14px;

      font-weight:
        900;

      cursor:
        pointer;
    }


    /* =========================
       結果
    ========================= */

    .test-result-container {
      display:
        none;
    }


    .test-back-button {
      margin-top:
        28px;
    }


    @media (
      max-width:
      700px
    ) {

      .test-menu {
        margin:
          20px auto;

        padding:
          22px 18px;
      }


      .test-menu h1 {
        font-size:
          24px;
      }


      .test-rank-grid {
        grid-template-columns:
          repeat(
            3,
            1fr
          );
      }


      .completion-test-button {
        font-size:
          16px;
      }
    }

  </style>
</head>


<body>


  <!-- =========================
       テストメニュー
  ========================= -->

  <section
    class="test-menu"
    id="test-menu"
  >

    <h1>
      結果画面テスト
    </h1>


    <p
      class="test-menu-description"
    >
      ランク・称号や100問完走時の結果画面を
      すぐに確認できます。
    </p>


    <!-- 100問完走 -->

    <button
      class="completion-test-button"
      id="completion-test-button"
      type="button"
    >
      100問完走画面を確認

      <span
        class="completion-test-sub"
      >
        「100問完走」バッジ付きで表示
      </span>
    </button>


    <!-- ランク一覧 -->

    <div
      class="test-rank-grid"
    >

      <button
        class="test-rank-button"
        data-score="0"
      >
        <strong>D</strong>
        0点
      </button>


      <button
        class="test-rank-button"
        data-score="20"
      >
        <strong>D+</strong>
        20点
      </button>


      <button
        class="test-rank-button"
        data-score="35"
      >
        <strong>C−</strong>
        35点
      </button>


      <button
        class="test-rank-button"
        data-score="40"
      >
        <strong>C</strong>
        40点
      </button>


      <button
        class="test-rank-button"
        data-score="50"
      >
        <strong>C+</strong>
        50点
      </button>


      <button
        class="test-rank-button"
        data-score="60"
      >
        <strong>B−</strong>
        60点
      </button>


      <button
        class="test-rank-button"
        data-score="65"
      >
        <strong>B</strong>
        65点
      </button>


      <button
        class="test-rank-button"
        data-score="70"
      >
        <strong>B+</strong>
        70点
      </button>


      <button
        class="test-rank-button"
        data-score="75"
      >
        <strong>A−</strong>
        75点
      </button>


      <button
        class="test-rank-button"
        data-score="80"
      >
        <strong>A</strong>
        80点
      </button>


      <button
        class="test-rank-button"
        data-score="85"
      >
        <strong>A+</strong>
        85点
      </button>


      <button
        class="test-rank-button"
        data-score="90"
      >
        <strong>S</strong>
        90点
      </button>


      <button
        class="test-rank-button"
        data-score="95"
      >
        <strong>S+</strong>
        95点
      </button>


      <button
        class="test-rank-button"
        data-score="99"
      >
        <strong>SS</strong>
        99点
      </button>


      <button
        class="test-rank-button"
        data-score="100"
      >
        <strong>SSS</strong>
        100点
      </button>

    </div>


    <!-- 任意点数 -->

    <div
      class="test-manual"
    >

      <label
        for="manual-score"
      >
        任意スコア：
      </label>


      <input
        id="manual-score"
        type="number"
        min="0"
        max="100"
        value="95"
      >


      <button
        id="manual-button"
        type="button"
      >
        表示
      </button>

    </div>

  </section>


  <!-- =========================
       結果画面
  ========================= -->

  <main
    class="
      container
      test-result-container
    "
    id="test-result-container"
  >

    <section
      class="
        quiz-card
        hero-card
      "
      id="test-result-card"
    >
    </section>

  </main>


  <!-- 本番と共通 -->

  <script
    src="rank.js"
  ></script>


  <script>

    const testMenu =
      document.getElementById(
        "test-menu"
      );


    const resultContainer =
      document.getElementById(
        "test-result-container"
      );


    const resultCard =
      document.getElementById(
        "test-result-card"
      );


    const VALID_QUESTION_CATEGORIES = [
      "モンスター",
      "アイテム",
      "ダンジョン",
      "仕様",
      "その他"
    ];


    /* =========================
       HTMLエスケープ
    ========================= */

    function escapeHtml(
      value
    ) {

      return String(
        value
      )

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );
    }


    /* =========================
       カテゴリ別正答率
    ========================= */

    function getTestCategoryStatsData() {

      return {

        モンスター: {
          correct: 19,
          total: 20
        },

        アイテム: {
          correct: 16,
          total: 20
        },

        ダンジョン: {
          correct: 15,
          total: 19
        },

        仕様: {
          correct: 18,
          total: 36
        },

        その他: {
          correct: 1,
          total: 5
        }
      };
    }


    function renderTestCategoryStats() {

      const categories = [

        {
          name:
            "モンスター",

          correct:
            19,

          total:
            20,

          accuracy:
            95,

          bar:
            "linear-gradient(90deg, #b88a1d, #f0d26d)",

          color:
            "#f0d26d"
        },


        {
          name:
            "アイテム",

          correct:
            16,

          total:
            20,

          accuracy:
            80,

          bar:
            "linear-gradient(90deg, #b88a1d, #f0d26d)",

          color:
            "#f0d26d"
        },


        {
          name:
            "ダンジョン",

          correct:
            15,

          total:
            19,

          accuracy:
            79,

          bar:
            "linear-gradient(90deg, #b96818, #e69a35)",

          color:
            "#e69a35"
        },


        {
          name:
            "仕様",

          correct:
            18,

          total:
            36,

          accuracy:
            50,

          bar:
            "linear-gradient(90deg, #b96818, #e69a35)",

          color:
            "#e69a35"
        },


        {
          name:
            "その他",

          correct:
            1,

          total:
            5,

          accuracy:
            20,

          bar:
            "linear-gradient(90deg, #9f3733, #df625b)",

          color:
            "#ef7772"
        }

      ];


      return `

        <section
          class="category-results"
        >

          <div
            class="category-results-title"
          >
            カテゴリ別正答率
          </div>


          <div
            class="category-results-list"
          >

            ${categories

              .map(
                function (
                  item
                ) {

                  return `

                    <div
                      class="category-result-row"
                    >

                      <div
                        class="category-result-top"
                      >

                        <span
                          class="category-result-name"
                        >
                          ${item.name}
                        </span>


                        <span
                          class="category-result-score"
                        >

                          ${item.correct}
                          /
                          ${item.total}


                          <strong
                            class="category-result-accuracy"

                            style="
                              color:
                                ${item.color};
                            "
                          >
                            ${item.accuracy}%
                          </strong>

                        </span>

                      </div>


                      <div
                        class="category-result-bar-wrap"
                      >

                        <div
                          class="category-result-bar"

                          style="
                            width:
                              ${item.accuracy}%;

                            background:
                              ${item.bar};
                          "
                        ></div>

                      </div>

                    </div>

                  `;
                }
              )

              .join("")}

          </div>

        </section>

      `;
    }


    /* =========================
       結果表示
    ========================= */

    function showTestResult(
      score,
      showCompletion =
        false
    ) {

      score =
        Number(
          score
        );


      if (
        Number.isNaN(
          score
        )

        ||

        score <
          0

        ||

        score >
          100
      ) {

        alert(
          "0〜100の点数を入力してください。"
        );

        return;
      }


      const rankResult =
        getRankResult(
          score
        );


      if (
        !rankResult
      ) {

        alert(
          "ランク情報を取得できませんでした。rank.js を確認してください。"
        );

        return;
      }


      resultCard.innerHTML = `

        <div
          class="result-screen"
        >

          <p
            class="hero-label"
          >
            ${
              showCompletion
                ? "COMPLETE TEST"
                : "RESULT TEST"
            }
          </p>


          <div
            class="result-brand"
          >

            <div
              class="result-brand-title"
            >

              <span
                class="title-asuka"
              >
                アスカ見参
              </span>


              <span
                class="title-haijin"
              >
                廃人検定
              </span>

            </div>


            <h1
              class="result-heading"
            >
              検定結果
            </h1>

          </div>


          <div
            style="
              margin:
                -12px 0
                16px;

              color:
                #888;

              font-size:
                12px;

              letter-spacing:
                0.05em;
            "
          >
            ${
              showCompletion

                ? "開発用・100問完走画面テスト"

                : "開発用結果画面テスト"
            }
          </div>


          <div
            class="final-score"
          >

            ${score}

            <span>
              /
              100
            </span>

          </div>


          <div
            class="percentage"
          >
            正答率
            ${score}%
          </div>


          ${
            showCompletion

              ? `

                <div
                  class="full-completion-badge"
                >

                  <span
                    class="full-completion-en"
                  >
                    ALL 100 QUESTIONS COMPLETE
                  </span>


                  <span
                    class="full-completion-title"
                  >
                    100問完走
                  </span>

                </div>

              `

              : ""
          }


          <div
            class="rank-panel"
          >

            <div
              class="rank-label"
            >
              あなたのランク・称号
            </div>


            <div
              class="rank-grade"
            >
              ${escapeHtml(
                rankResult.rank
              )}
            </div>


            <div
              class="rank"
            >
              ${escapeHtml(
                rankResult.title
              )}
            </div>


            <div
              class="rank-comment"
            >
              ${rankResult.comment}
            </div>

          </div>


          ${renderTestCategoryStats()}


          <button
            class="
              next-button
              result-share-button
            "
            type="button"
          >
            <span
              style="
                display:inline-flex;
                align-items:center;
                justify-content:center;
                gap:10px;
              "
            >
              <svg
                viewBox="0 0 24 24"
                width="22"
                height="22"
                aria-hidden="true"
                focusable="false"
                style="
                  display:block;
                  fill:currentColor;
                  flex:0 0 auto;
                "
              >
                <path
                  d="M18.244 2H21.5l-7.1 8.114L22.75 22h-6.54l-5.12-6.71L5.33 22H2.07l7.6-8.69L1.25 2h6.71l4.63 6.12L18.244 2Zm-1.15 18h1.8L6.38 3.9H4.48L17.094 20Z"
                ></path>
              </svg>

              <span>
                結果をシェア
              </span>
            </span>
          </button>


          <div
            class="result-share-status"
            aria-live="polite"
            style="
              min-height:1.5em;
              margin-top:10px;
              font-size:0.9rem;
              opacity:0.82;
            "
          ></div>


          <button
            class="
              restart-button
              test-back-button
            "
            type="button"
          >
            テストメニューへ戻る
          </button>

        </div>

      `;


      testMenu.style.display =
        "none";


      resultContainer.style.display =
        "block";


      window.scrollTo(
        {
          top:
            0,

          behavior:
            "auto"
        }
      );


      document
        .querySelector(
          ".test-back-button"
        )
        .addEventListener(
          "click",
          showTestMenu
        );


      const shareButton =
        document.querySelector(
          ".result-share-button"
        );


      const shareStatus =
        document.querySelector(
          ".result-share-status"
        );


      if (
        shareButton
      ) {

        shareButton.addEventListener(
          "click",
          async function () {

            const originalHtml =
              shareButton.innerHTML;


            shareButton.disabled =
              true;

            shareButton.textContent =
              "結果画像を作成中...";


            if (
              shareStatus
            ) {

              shareStatus.textContent =
                "X投稿用の結果カードを作成しています。";
            }


            try {

              const shareMode =
                await shareQuizResult(
                  {
                    scoreValue:
                      score,

                    totalValue:
                      100,

                    rankResult:
                      rankResult,

                    statsSource:
                      getTestCategoryStatsData(),

                    statsComplete:
                      true
                  }
                );


              if (
                shareStatus
              ) {

                if (
                  shareMode ===
                    "native-share"
                ) {

                  shareStatus.textContent =
                    "共有画面を開きました。Xを選んで投稿してください。";

                } else if (
                  shareMode ===
                    "desktop-clipboard"
                ) {

                  shareStatus.textContent =
                    "結果画像をコピーしました。Xの投稿画面で Ctrl+V を押してください。";

                } else {

                  shareStatus.textContent =
                    "結果画像を保存しました。Xの投稿画面で画像を添付してください。";
                }
              }


            } catch (error) {

              if (
                error &&
                error.name ===
                  "AbortError"
              ) {

                if (
                  shareStatus
                ) {

                  shareStatus.textContent =
                    "共有をキャンセルしました。";
                }


              } else {

                console.error(
                  "結果共有エラー:",
                  error
                );


                if (
                  shareStatus
                ) {

                  shareStatus.textContent =
                    "共有できませんでした。もう一度お試しください。";
                }
              }


            } finally {

              shareButton.disabled =
                false;

              shareButton.innerHTML =
                originalHtml;
            }
          }
        );
      }
    }


    async function shareQuizResult(
      {
        scoreValue,
        totalValue,
        rankResult,
        statsSource,
        statsComplete
      }
    ) {

      const shareUrl =
        new URL(
          "./",
          window.location.href
        ).href;


      const shareText =
        `アスカ見参 廃人検定\n` +
        `${scoreValue} / ${totalValue}点\n` +
        `${rankResult.rank}「${rankResult.title}」\n\n` +
        `あなたは何点取れる？\n` +
        `#アスカ見参 #アスカ見参廃人検定`;


      const intentUrl =
        "https://x.com/intent/tweet" +
        `?text=${encodeURIComponent(shareText)}` +
        `&url=${encodeURIComponent(shareUrl)}`;


      const canvas =
        createResultShareCanvas(
          {
            scoreValue,
            totalValue,
            rankResult,
            statsSource,
            statsComplete,
            shareUrl,
            comment:
              rankResult.comment || ""
          }
        );


      const blob =
        await canvasToBlob(
          canvas
        );


      const file =
        new File(
          [blob],
          `asuka-haijin-kentei-${scoreValue}.png`,
          {
            type:
              "image/png"
          }
        );


      const shareData = {

        title:
          "アスカ見参 廃人検定",

        text:
          shareText,

        url:
          shareUrl,

        files: [
          file
        ]
      };


      const isMobile =
        isMobileShareEnvironment();


      if (
        isMobile &&
        navigator.share &&
        navigator.canShare &&
        navigator.canShare(
          {
            files: [
              file
            ]
          }
        )
      ) {

        await navigator.share(
          shareData
        );

        return "native-share";
      }


      const copied =
        await copyResultImageToClipboard(
          blob
        );


      if (
        copied
      ) {

        alert(
          "結果画像をクリップボードにコピーしました。\n\nこれからXの投稿画面を開きます。\n投稿画面で Ctrl+V を押すと画像を添付できます。"
        );

        openXIntent(
          intentUrl
        );

        return "desktop-clipboard";
      }


      downloadResultImage(
        blob,
        file.name
      );


      alert(
        "このブラウザでは画像をクリップボードへコピーできなかったため、結果画像をPNGで保存しました。\n\nこれからXの投稿画面を開きます。保存した画像を添付してください。"
      );


      openXIntent(
        intentUrl
      );


      return "desktop-download";
    }


    function isMobileShareEnvironment() {

      if (
        navigator.userAgentData &&
        typeof navigator.userAgentData.mobile ===
          "boolean"
      ) {

        return navigator.userAgentData.mobile;
      }


      const userAgent =
        navigator.userAgent ||
        "";


      if (
        /Android|iPhone|iPod|Mobile/i.test(
          userAgent
        )
      ) {

        return true;
      }


      if (
        /iPad/i.test(
          userAgent
        )
      ) {

        return true;
      }


      if (
        /Macintosh/i.test(
          userAgent
        ) &&
        navigator.maxTouchPoints >
          1
      ) {

        return true;
      }


      return false;
    }


    async function copyResultImageToClipboard(
      blob
    ) {

      if (
        !navigator.clipboard ||
        typeof navigator.clipboard.write !==
          "function" ||
        typeof ClipboardItem ===
          "undefined"
      ) {

        return false;
      }


      try {

        const clipboardItem =
          new ClipboardItem(
            {
              "image/png":
                blob
            }
          );


        await navigator.clipboard.write(
          [
            clipboardItem
          ]
        );


        return true;


      } catch (error) {

        console.warn(
          "結果画像のクリップボードコピーに失敗しました:",
          error
        );

        return false;
      }
    }

      /* =========================

    function canvasToBlob(
      canvas
    ) {

      return new Promise(
        function (
          resolve,
          reject
        ) {

          canvas.toBlob(
            function (
              blob
            ) {

              if (
                blob
              ) {

                resolve(
                  blob
                );


              } else {

                reject(
                  new Error(
                    "結果画像を作成できませんでした。"
                  )
                );
              }
            },
            "image/png"
          );
        }
      );
    }


    function downloadResultImage(
      blob,
      filename
    ) {

      const objectUrl =
        URL.createObjectURL(
          blob
        );


      const link =
        document.createElement(
          "a"
        );


      link.href =
        objectUrl;

      link.download =
        filename;


      document.body.appendChild(
        link
      );


      link.click();


      link.remove();


      setTimeout(
        function () {

          URL.revokeObjectURL(
            objectUrl
          );
        },
        1000
      );
    }


    function formatShareHost(
      value
    ) {

      try {

        return new URL(
          value
        ).host;


      } catch (error) {

        return "";
      }
    }


    function stripHtmlForShare(
      value
    ) {

      const temp =
        document.createElement(
          "div"
        );


      temp.innerHTML =
        String(
          value || ""
        )
          .replace(
            /<\s*\/p\s*>/gi,
            "\n"
          )
          .replace(
            /<\s*br\s*\/?\s*>/gi,
            "\n"
          );


      const text =
        (
          temp.textContent ||
          temp.innerText ||
          ""
        )
          .replace(
            /\n\s*\n+/g,
            "\n"
          )
          .trim();


      return text;
    }


    function drawWrappedText(
      ctx,
      text,
      centerX,
      startY,
      maxWidth,
      startSize,
      minSize,
      lineHeight,
      maxLines
    ) {

      const paragraphs =
        String(
          text || ""
        )
          .split(
            /\n+/
          )
          .map(
            function (
              line
            ) {

              return line.trim();
            }
          )
          .filter(
            Boolean
          );


      let fontSize =
        startSize;

      let lines =
        [];


      const buildLines =
        function (
          size
        ) {

          ctx.font =
            `700 ${size}px "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif`;


          const built =
            [];


          paragraphs.forEach(
            function (
              paragraph
            ) {

              let current =
                "";


              Array.from(
                paragraph
              ).forEach(
                function (
                  char
                ) {

                  const test =
                    current +
                    char;


                  if (
                    current &&
                    ctx.measureText(
                      test
                    ).width >
                      maxWidth
                  ) {

                    built.push(
                      current
                    );

                    current =
                      char;


                  } else {

                    current =
                      test;
                  }
                }
              );


              if (
                current
              ) {

                built.push(
                  current
                );
              }
            }
          );


          return built;
        };


      while (
        fontSize >
          minSize
      ) {

        lines =
          buildLines(
            fontSize
          );


        if (
          lines.length <=
            maxLines
        ) {

          break;
        }


        fontSize -=
          1;
      }


      lines =
        buildLines(
          fontSize
        );


      if (
        lines.length >
          maxLines
      ) {

        lines =
          lines.slice(
            0,
            maxLines
          );


        const lastIndex =
          lines.length -
          1;


        lines[
          lastIndex
        ] =
          lines[
            lastIndex
          ]
            .replace(
              /[。！？!?、,\s]+$/g,
              ""
            ) +
          "…";
      }


      ctx.font =
        `700 ${fontSize}px "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif`;

      ctx.textAlign =
        "center";

      ctx.textBaseline =
        "middle";


      const actualLineHeight =
        Math.max(
          lineHeight,
          fontSize +
            6
        );


      lines.forEach(
        function (
          line,
          index
        ) {

          ctx.fillText(
            line,
            centerX,
            startY +
              index *
              actualLineHeight
          );
        }
      );


      ctx.textBaseline =
        "alphabetic";
    }


    function drawFittedText(
      ctx,
      text,
      x,
      y,
      maxWidth,
      startSize,
      minSize
    ) {

      let size =
        startSize;


      while (
        size >
          minSize
      ) {

        ctx.font =
          `800 ${size}px "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif`;


        if (
          ctx.measureText(
            text
          ).width <=
            maxWidth
        ) {

          break;
        }


        size -=
          1;
      }


      ctx.fillText(
        text,
        x,
        y
      );
    }


    function roundRect(
      ctx,
      x,
      y,
      width,
      height,
      radius
    ) {

      const safeRadius =
        Math.min(
          radius,
          width /
            2,
          height /
            2
        );


      ctx.beginPath();

      ctx.moveTo(
        x +
          safeRadius,
        y
      );

      ctx.lineTo(
        x +
          width -
          safeRadius,
        y
      );

      ctx.quadraticCurveTo(
        x +
          width,
        y,
        x +
          width,
        y +
          safeRadius
      );

      ctx.lineTo(
        x +
          width,
        y +
          height -
          safeRadius
      );

      ctx.quadraticCurveTo(
        x +
          width,
        y +
          height,
        x +
          width -
          safeRadius,
        y +
          height
      );

      ctx.lineTo(
        x +
          safeRadius,
        y +
          height
      );

      ctx.quadraticCurveTo(
        x,
        y +
          height,
        x,
        y +
          height -
          safeRadius
      );

      ctx.lineTo(
        x,
        y +
          safeRadius
      );

      ctx.quadraticCurveTo(
        x,
        y,
        x +
          safeRadius,
        y
      );

      ctx.closePath();
    }
